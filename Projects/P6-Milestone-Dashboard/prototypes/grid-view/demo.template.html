  var LABELS={};
  F.sched.concat(F.userms).forEach(function(r){ LABELS['activity:'+r.id]=r.id+'  '+r.name; });

  function labelOf(ref){ return LABELS[ref]||(/^activity:(.*)-\d\d$/.test(ref)?LABELS[ref.replace(/-\d\d$/,'')]+' (stress copy)':''); }
  function listsOpt(refOf){ return {store:lstore,refOf:refOf,labelOf:labelOf,onChange:function(r){ log('onListsChange',[r.kind||'create']); }}; }

  // Schedule changes: earlier imports kept as snapshots (SRETCompare). The

  var C=window.SRETCompare;

    return F.snaps.map(function(x){ return C.snapshot(x.meta,x.rows); }).concat([cur]);
  }
  var CMP={cur:'pu-0829',basis:null};   // basis null = the default for the chosen schedule
  function changesData(){
    var all=snaps(), cur=all.filter(function(s){ return s.id===CMP.cur; })[0];
    var bs=C.bases(all,cur), basis=CMP.basis?(bs.filter(function(b){ return b.snap.id===CMP.basis; })[0]||{}).snap:C.defaultBasis(all,cur);

  }
  var CHANGE_COLS=[{key:'id',label:'Activity ID',type:'text',width:110},{key:'name',label:'Name',type:'text',width:240},
    {key:'change',label:'Change',type:'text',width:100,tones:{Later:'crit',Earlier:'track',Completed:'done',New:'future',Removed:'risk','Float only':'future'}},
