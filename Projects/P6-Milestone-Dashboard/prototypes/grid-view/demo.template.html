<body>
<header class="demo-hd"><b>SRET grid view prototype</b>
  <button type="button" id="demo-theme" aria-pressed="false">Dark theme</button></header>
<main class="demo-board" id="demo-board">
  <h1>Grid view (D-09)</h1>
  <p>Stand-in for the board area. In the app each button below is an entry point: Workspace, User milestones, View items; Workspace, Comments and markups, a collection row; Data and view, Schedule activities.</p>

    <button type="button" class="sg-btn" id="go-sched">Schedule activities</button>
    <button type="button" class="sg-btn" id="go-stress">Stress test: 2,000 rows</button>

<script id="app-script">
/*@GRID_JS@*/
/*@COLLECTIONS_JS@*/
/*@FIXTURES@*/
(function(){
  'use strict';
  var F=window.SRET_FIXTURES;
  var LOG=window.DEMO_LOG=[];
  var logEl=document.getElementById('demo-log');
  function log(kind,args){
    LOG.push({kind:kind,args:args});
    logEl.textContent=LOG.map(function(e){ return e.kind+' '+JSON.stringify(e.args); }).join('\n');
  }
  // The demo's own stores stand in for USER_MILESTONES and the annotation stores.
  var store={userms:F.userms.slice(),annot:F.annot.slice(),sched:F.sched.slice()};
  var seq=900;
  // Mirror of the app's ensureXLSX(): SheetJS from the same CDN, on demand.
  function ensureXLSX(){
    return new Promise(function(res,rej){
      if(typeof XLSX!=='undefined') return res();
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=function(){ res(); };
      s.onerror=function(){ rej(new Error('Excel export needs the SheetJS library, which is fetched from a CDN the first time it is used, and that request was blocked or failed.')); };
      document.head.appendChild(s);
    });
  }
  function patch(list,keyName,key,field,value){
    for(var i=0;i<list.length;i++) if(list[i][keyName]===key){ list[i]=Object.assign({},list[i]); list[i][field]=value; return; }
  }
  var host=document.getElementById('demo-board');
  // One lists store for every screen, as the app will hold one: saved lists
  // in the annotation layer, My temp list as session working state.
  // The same activity reached from two screens is one item.
  var lstore=window.DEMO_LISTS=SRETCollections.newStore();
  SRETCollections.create(lstore,'Site walk 3-Oct','2026-09-27T00:00:00Z');
  SRETCollections.create(lstore,'Owner review items','2026-09-27T00:00:00Z');
  // Names for the temp list panel, from any screen's data (the app would read its stores).
  var LABELS={};
  F.sched.concat(F.userms).forEach(function(r){ LABELS['activity:'+r.id]=r.id+'  '+r.name; });
  F.annot.forEach(function(r){ LABELS['annot:'+r.aid]=r.aid+'  '+r.kind+' on '+r.target; });
  function labelOf(ref){ return LABELS[ref]||(/^activity:(.*)-\d\d$/.test(ref)?LABELS[ref.replace(/-\d\d$/,'')]+' (stress copy)':''); }
  function listsOpt(refOf){ return {store:lstore,refOf:refOf,labelOf:labelOf,onChange:function(r){ log('onListsChange',[r.kind||'create']); }}; }
  var ACT=function(k){ return 'activity:'+k; }, ANN=function(k){ return 'annot:'+k; };
  var back=function(){ log('onBack',[]); };
  var CONFIGS={
    userms:function(){ return {
      title:'User milestones',rowKey:'id',editable:true,exportName:'User milestones',
      columns:F.cols.userms,rows:store.userms.slice(),lists:listsOpt(ACT),
      onEdit:function(k,f,v){ log('onEdit',[k,f,v]);
        if(f==='progress' && v!=null && (v<0||v>100)) return false;   // app-side rule: 0 to 100
        patch(store.userms,'id',k,f,v); },
      onAdd:function(){ var id='USR-'+(++seq); var r={id:id,name:'New milestone',type:'MS',state:'FUTURE',progress:0,
          start:null,finish:null,band:'User Defined Milestones',pred:'',succ:'',comment:''};
        store.userms.push(r); log('onAdd',[id]); return r; },
      onDelete:function(keys){ log('onDelete',[keys]); store.userms=store.userms.filter(function(r){ return keys.indexOf(r.id)<0; }); },
      onBack:back,ensureXLSX:ensureXLSX,host:host}; },
    annot:function(){ return {
      title:'Annotations: W/E 27-Sep-26',rowKey:'aid',editable:true,exportName:'Annotations W-E 27-Sep-26',
      columns:F.cols.annot,rows:store.annot.slice(),lists:listsOpt(ANN),
      onEdit:function(k,f,v){ log('onEdit',[k,f,v]); patch(store.annot,'aid',k,f,v); },
      onDelete:function(keys){ log('onDelete',[keys]); store.annot=store.annot.filter(function(r){ return keys.indexOf(r.aid)<0; }); },
      onBack:back,ensureXLSX:ensureXLSX,host:host}; },
    sched:function(){ return {
      title:'Schedule activities',rowKey:'id',editable:true,exportName:'Schedule activities',
      columns:F.cols.sched,rows:store.sched.slice(),lists:listsOpt(ACT),
      onEdit:function(k,f,v){ log('onEdit',[k,f,v]); patch(store.sched,'id',k,f,v); },
      onBack:back,ensureXLSX:ensureXLSX,host:host}; },
    stress:function(){ return {
      title:'Schedule activities (2,000 row stress set)',rowKey:'id',editable:true,exportName:'Stress',
      columns:F.cols.sched,rows:window.SRET_STRESS(2000),lists:listsOpt(ACT),
      onEdit:function(k,f,v){ log('onEdit',[k,f,v]); },
      onBack:back,ensureXLSX:ensureXLSX,host:host}; }
  };
  // DEMO_LAST_ROWS is the exact array handed to open(), so the check can prove
  // the grid never mutates the caller's objects.
  window.DEMO_OPEN=function(name){ var c=CONFIGS[name](); window.DEMO_LAST_ROWS=c.rows; return SRETGrid.open(c); };
  ['userms','annot','sched','stress'].forEach(function(n){
    document.getElementById('go-'+n).addEventListener('click',function(){ window.DEMO_OPEN(n); });
  });
  var tb=document.getElementById('demo-theme');
  tb.addEventListener('click',function(){
    var dark=document.documentElement.getAttribute('data-theme')!=='dark';
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    tb.setAttribute('aria-pressed',String(dark)); tb.textContent=dark?'Light theme':'Dark theme';
  });
  // Opens on User milestones so a reviewer (and the palette swap check) sees
  // the grid at load; #home opens the launcher instead.
  if(location.hash!=='#home') window.DEMO_OPEN('userms');
})();
</script>
