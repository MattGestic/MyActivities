  root.SRETGrid=api;
})(window);

/* =====================================================================
   SRET lists. The one implementation of "My temp list" and saved lists,
   shared by the grid view and the dashboard. Both call these functions;
   neither keeps its own copy of the rules.

   Purpose (Matt, 2026-09-27): let the user keep track of important
   activities in groups, aggregate them by a scope or reason, and build a
   selection set to bulk edit across several filtered states.

   Flow (Matt, 2026-09-27):
     1. Select items and add them to My temp list (any screen, any filter state).
     2. Expand the temp list to view its items; select some or all of them
        and add them to a saved list (an existing one, or a new one).
     3. Remove selected items from the temp list.
     4. Clear the temp list.
   Adding to a saved list leaves the temp list as it is: removing is step 3.

   Rules:
     - An item can be in any number of saved lists (default).
     - settings.singleList (a future setting, "Limit items to a single
       list"): when true, adding an item to a list moves it out of any other
       list, and the result says how many moved and from where.
     - The temp list is independent of saved lists.
     - The temp list is working state for the session; saved lists belong to
       the annotation layer and are persisted by the caller.

   Store (owned and persisted by the caller):
     { seq, settings: { singleList: false }, temp: [ref],
       list: [ { id, name, items: [ref], createdAt, updatedAt } ] }
   A ref is a caller-chosen stable string, e.g. 'activity:SNIP-118' (schedule
   activity or user milestone, so the same activity from any screen is one
   item) or 'annot:A-004'.

   Reads and writes no app global. Never touches schedule data.
   ===================================================================== */
(function(root){
  'use strict';

  function newStore(opts){ return {seq:0,settings:{singleList:!!(opts&&opts.singleList)},temp:[],list:[]}; }
  function ensure(store){
    if(!store.temp) store.temp=[]; if(!store.list) store.list=[]; if(!store.settings) store.settings={singleList:false};
    return store;
  }
  function single(store){ return !!(store.settings&&store.settings.singleList); }
  function normName(n){ return String(n==null?'':n).replace(/\s+/g,' ').trim(); }
  function stamp(now){ return now||new Date().toISOString(); }
  function uniqueRefs(refs){
    var out=[];
    (refs||[]).forEach(function(r){ r=r==null?'':String(r); if(r && out.indexOf(r)<0) out.push(r); });
    return out;
  }
  function find(store,id){
    for(var i=0;i<store.list.length;i++) if(store.list[i].id===id) return store.list[i];
    return null;
  }
  function findByName(store,name){
    var k=normName(name).toLowerCase();
    for(var i=0;i<store.list.length;i++) if(store.list[i].name.toLowerCase()===k) return store.list[i];
    return null;
  }
  function listsOf(store,ref){
    return store.list.filter(function(c){ return c.items.indexOf(ref)>=0; });
  }

  // ---------- temp list ----------
  function temp(store){ return ensure(store).temp.slice(); }
  function inTemp(store,ref){ return ensure(store).temp.indexOf(String(ref))>=0; }
  function tempAdd(store,refs){
    ensure(store);
    var added=0, already=0;
    uniqueRefs(refs).forEach(function(r){
      if(store.temp.indexOf(r)>=0) already++; else { store.temp.push(r); added++; }
    });
    return {kind:'tempAdd',added:added,already:already,total:store.temp.length};
  }
  function tempRemove(store,refs){
    ensure(store);
    var removed=0;
    uniqueRefs(refs).forEach(function(r){ var i=store.temp.indexOf(r); if(i>=0){ store.temp.splice(i,1); removed++; } });
    return {kind:'tempRemove',removed:removed,total:store.temp.length};
  }
  function tempClear(store){
    ensure(store);
    var n=store.temp.length; store.temp=[];
    return {kind:'tempClear',cleared:n,total:0};
  }

  // ---------- saved lists ----------
  function list(store){
    return ensure(store).list.map(function(c){ return {id:c.id,label:c.name,count:c.items.length}; });
  }
  // Names of every saved list holding ref, in list order.
  function membership(store,ref){
    return listsOf(ensure(store),String(ref)).map(function(c){ return c.name; });
  }
  function create(store,name,now){
    ensure(store);
    var n=normName(name);
    if(!n) return {error:'Enter a name for the list.'};
    if(n.length>60) return {error:'Keep the list name to 60 characters or fewer.'};
    if(n.toLowerCase()==='my temp list') return {error:'That name is used by the temp list. Choose another.'};
    if(findByName(store,n)) return {error:'A list called "'+n+'" already exists.'};
    store.seq=(store.seq||0)+1;
    var c={id:'UL-'+String(store.seq).padStart(3,'0'),name:n,items:[],createdAt:stamp(now),updatedAt:stamp(now)};
    store.list.push(c);
    return {collection:c};
  }
  // Adds refs to one list. One already in this list is counted, never
  // duplicated. With settings.singleList, one in another list moves.
  function assign(store,id,refs,now){
    ensure(store);
    var c=find(store,id);
    if(!c) return {error:'That list no longer exists.'};
    var added=0, already=0, movedFrom={};
    uniqueRefs(refs).forEach(function(r){
      if(c.items.indexOf(r)>=0){ already++; return; }
      if(single(store)) listsOf(store,r).forEach(function(other){
        other.items.splice(other.items.indexOf(r),1); other.updatedAt=stamp(now);
        movedFrom[other.name]=(movedFrom[other.name]||0)+1;
      });
      c.items.push(r); added++;
    });
    if(added) c.updatedAt=stamp(now);
    return {kind:'assign',collection:c,added:added,already:already,movedFrom:movedFrom};
  }
  // The items of one saved list (a copy), or [] when it does not exist.
  function itemsOf(store,id){ var c=find(ensure(store),id); return c?c.items.slice():[]; }
  // ids of every saved list holding ref (for filtering by list).
  function listIdsOf(store,ref){
    return listsOf(ensure(store),String(ref)).map(function(c){ return c.id; });
  }
  // Takes refs out of one saved list; the items and other lists are untouched.
  function removeFromList(store,id,refs,now){
    ensure(store);
    var c=find(store,id);
    if(!c) return {error:'That list no longer exists.'};
    var removed=0;
    uniqueRefs(refs).forEach(function(r){ var i=c.items.indexOf(r); if(i>=0){ c.items.splice(i,1); removed++; } });
    if(removed) c.updatedAt=stamp(now);
    return {kind:'removeFromList',collection:c,removed:removed};
  }
  // Deletes the list itself. Its items stay wherever else they are.
  function deleteList(store,id){
    ensure(store);
    var c=find(store,id);
    if(!c) return {error:'That list no longer exists.'};
    store.list.splice(store.list.indexOf(c),1);
    return {kind:'deleteList',collection:c,count:c.items.length};
  }
  function unassign(store,refs,now){
    ensure(store);
    var removed=0;
    uniqueRefs(refs).forEach(function(r){
      var cs=listsOf(store,r); cs.forEach(function(c){ c.items.splice(c.items.indexOf(r),1); c.updatedAt=stamp(now); });
      if(cs.length) removed++;
    });
    return {kind:'unassign',removed:removed};
  }

  // ---------- step 2: selected temp items into a saved list ----------
  // refs: the temp items the user selected; only refs on the temp list count.
  // The temp list is left as it is.
  function pickFromTemp(store,refs){
    return uniqueRefs(refs).filter(function(r){ return store.temp.indexOf(r)>=0; });
  }
  function addFromTemp(store,id,refs,now){
    ensure(store);
    var picked=pickFromTemp(store,refs);
    if(!picked.length) return {error:'Select items on My temp list first.'};
    if(!find(store,id)) return {error:'Choose a saved list to add to.'};
    var r=assign(store,id,picked,now); r.kind='addFromTemp';
    return r;
  }
  function saveFromTemp(store,name,refs,now){
    ensure(store);
    var picked=pickFromTemp(store,refs);
    if(!picked.length) return {error:'Select items on My temp list first.'};
    var made=create(store,name,now); if(made.error) return made;
    var r=assign(store,made.collection.id,picked,now); r.kind='saveFromTemp';
    return r;
  }

  // ---------- the sentence both UIs show ----------
  function plural(n,word){ return n+' '+word+(n===1?'':'s'); }
  function describe(r){
    if(!r) return '';
    if(r.error) return r.error;
    switch(r.kind){
      case 'tempAdd':
        return (r.added?'Added '+plural(r.added,'item')+' to My temp list.':'No new items added to My temp list.')+
               (r.already?' '+plural(r.already,'item')+' '+(r.already===1?'was':'were')+' already on it.':'')+
               ' It now holds '+plural(r.total,'item')+'.';
      case 'tempRemove': return 'Removed '+plural(r.removed,'item')+' from My temp list. It now holds '+plural(r.total,'item')+'.';
      case 'tempClear':  return 'Cleared My temp list ('+plural(r.cleared,'item')+').';
      case 'unassign':   return 'Removed '+plural(r.removed,'item')+' from their lists.';
      case 'removeFromList': return 'Removed '+plural(r.removed,'item')+' from "'+r.collection.name+'".';
      case 'deleteList':  return 'Deleted the list "'+r.collection.name+'" ('+plural(r.count,'item')+'). The items themselves are unchanged.';
    }
    var name='"'+r.collection.name+'"';
    var s=(r.kind==='saveFromTemp'?'Saved '+plural(r.added+r.already,'item')+' as the new list '+name+'.'
          :(r.added?'Added '+plural(r.added,'item')+' to '+name+'.':'No new items added to '+name+'.'));
    if(r.already) s+=' '+plural(r.already,'item')+' '+(r.already===1?'was':'were')+' already in it.';
    var mv=Object.keys(r.movedFrom||{});
    if(mv.length) s+=' Moved from '+mv.map(function(k){ return '"'+k+'" ('+r.movedFrom[k]+')'; }).join(', ')+'.';
    return s;
  }

  root.SRETCollections={newStore:newStore,temp:temp,inTemp:inTemp,tempAdd:tempAdd,tempRemove:tempRemove,
                        tempClear:tempClear,list:list,membership:membership,create:create,assign:assign,
                        unassign:unassign,listIdsOf:listIdsOf,itemsOf:itemsOf,removeFromList:removeFromList,deleteList:deleteList,
                        addFromTemp:addFromTemp,saveFromTemp:saveFromTemp,describe:describe};
})(window);

/* =====================================================================
   SRET date reading (Matt, 2026-09-28). One engine for every import: the
   grid's milestone import and, at merge, the dashboard's schedule import.
   No UI, no app globals.

   A sheet's dates arrive as whatever the author typed or Excel exported:
   9-Oct-26, 2026-10-09, 09/10/26, 10.09.2026, 9 October 2026, an Excel
   serial. Numeric dates are ambiguous, so the order is worked out from all
   the values of a file together, before any single value is read:

     - Split each value on any break: - / . space or comma.
     - A four-digit first part is a year (year first). A four-digit last part
       is a year (year last).
     - A part above 12 cannot be a month: above 12 first means day first;
       above 12 in the middle means month first.
     - A part above 31 can only be a year.
     - An order that makes any value an impossible date is dropped.
     - If several orders still fit, the part that barely changes is the year
       (a sheet's dates span months, so e.g. every value starting 26 means
       year first).
     - Still undecided: day first (the default), marked as not confirmed.

   API (window.SRETDates):
     detect(values)          -> {order:'DMY'|'MDY'|'YMD', confirmed, reason, numeric, ambiguous}
     parse(v, order)         -> {ok:true, value:'YYYY-MM-DD'|null} | {ok:false}
     orderLabel(order)       -> 'day/month/year' ...
     example(order)          -> '9/10/26 is 9-Oct-26' ...
   Two-digit years are 20yy, the rule the app already uses.
   ===================================================================== */
(function(root){
  'use strict';
  var MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  var ORDERS=['DMY','YMD','MDY'];   // preference when nothing else decides
  var LABEL={DMY:'day/month/year',MDY:'month/day/year',YMD:'year/month/day'};

  function pad(n){ return String(n).padStart(2,'0'); }
  function iso(y,m,d){ return y+'-'+pad(m)+'-'+pad(d); }
  function valid(y,m,d){
    if(!(m>=1&&m<=12&&d>=1&&d<=31)) return false;
    var dt=new Date(Date.UTC(y,m-1,d));
    return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d;
  }
  function year(t){ var y=+t; return t.length<=2?2000+y:y; }
  function monthOf(t){
    var i=MONTHS.indexOf(String(t).slice(0,3).toLowerCase());
    return i>=0&&/^[a-z]+\.?$/i.test(t)?i+1:0;
  }
  // A trailing time (P6 and Excel exports carry one) is not part of the date.
  function clean(v){
    return String(v).replace(/\s+/g,' ').trim()
      .replace(/[ T]\d{1,2}:\d{2}(:\d{2}(\.\d+)?)?(\s*[AaPp][Mm])?(Z|[+-]\d{2}:?\d{2})?$/,'').trim();
  }
  // What kind of value this is, and its three parts.
  function shape(v){
    if(v==null||v==='') return {kind:'blank'};
    if(v instanceof Date) return isNaN(v)?{kind:'bad'}:{kind:'date',d:v};
    var s=clean(v);
    if(!s) return {kind:'blank'};
    if(/^\d{5}(\.\d+)?$/.test(s)) return {kind:'serial',n:+s};
    if(/^\d{8}$/.test(s)) return {kind:'num',p:[s.slice(0,4),s.slice(4,6),s.slice(6,8)]};
    var p=s.split(/[-\/.,\s]+/).filter(Boolean);
    if(p.length!==3) return {kind:'bad'};
    if(p.every(function(x){ return /^\d{1,4}$/.test(x); })) return {kind:'num',p:p};
    // Month written as a word, in any position: 9 Oct 26, Oct 9 2026, 2026-Oct-09.
    for(var i=0;i<3;i++){
      var m=monthOf(p[i]);
      if(m){
        var rest=p.filter(function(_,j){ return j!==i; });
        if(!rest.every(function(x){ return /^\d{1,4}$/.test(x); })) return {kind:'bad'};
        var y,d;
        if(rest[0].length===4){ y=rest[0]; d=rest[1]; }
        else { d=rest[0]; y=rest[1]; }
        return {kind:'named',y:year(y),m:m,d:+d};
      }
    }
    return {kind:'bad'};
  }
  function byOrder(p,order){
    var y,m,d;
    if(order==='YMD'){ y=p[0]; m=p[1]; d=p[2]; }
    else if(order==='MDY'){ m=p[0]; d=p[1]; y=p[2]; }
    else { d=p[0]; m=p[1]; y=p[2]; }
    // A four-digit part is a year wherever the order says the year is.
    if(y.length===3||m.length>2||d.length>2) return null;
    return {y:year(y),m:+m,d:+d};
  }
  function fits(p,order){ var r=byOrder(p,order); return !!r&&valid(r.y,r.m,r.d); }

  function detect(values){
    var nums=[];
    // A four-digit first part (2026-10-09, 20261009) reads one way only, so it
    // does not vote; the order is about the values that could be misread.
    (values||[]).forEach(function(v){ var s=shape(v); if(s.kind==='num'&&s.p[0].length!==4) nums.push(s.p); });
    var out={order:'DMY',confirmed:false,reason:'',numeric:nums.length,ambiguous:0};
    if(!nums.length){ out.confirmed=true; out.reason='Every date reads one way only.'; return out; }
    // Orders that read every numeric value as a real date.
    var ok=ORDERS.filter(function(o){ return nums.every(function(p){ return fits(p,o); }); });
    var why='', mixed=false;
    if(!ok.length){ mixed=true;
      // Mixed or broken file: keep the order that reads the most values.
      var best=ORDERS.map(function(o){ return [o,nums.filter(function(p){ return fits(p,o); }).length]; })
        .sort(function(a,b){ return b[1]-a[1]; });
      ok=[best[0][0]];
      why='Not every date fits one order; '+best[0][1]+' of '+nums.length+' fit '+LABEL[best[0][0]]+'.';
    } else if(ok.length===1){
      why=reasonFor(ok[0],nums);
    }
    if(ok.length>1){
      // Year position: the part that barely changes across the file.
      var distinct=[0,1,2].map(function(i){ var s={}; nums.forEach(function(p){ s[+p[i]]=1; }); return Object.keys(s).length; });
      var yearFirst=ok.indexOf('YMD')>=0, yearLast=ok.indexOf('DMY')>=0||ok.indexOf('MDY')>=0;
      if(yearFirst&&yearLast&&nums.length>=3&&distinct[0]!==distinct[2]){
        if(distinct[0]<distinct[2]){ ok=['YMD']; why='The first part barely changes ('+distinct[0]+' value'+(distinct[0]===1?'':'s')+'), so it is the year.'; }
        else ok=ok.filter(function(o){ return o!=='YMD'; });
      }
    }
    if(ok.length>1){
      out.order=ok.indexOf('DMY')>=0?'DMY':ok[0];
      out.reason='Nothing in the file settles the order; '+LABEL[out.order]+' is assumed.';
      out.ambiguous=nums.filter(function(p){
        return ok.some(function(o){ var a=byOrder(p,o), b=byOrder(p,out.order); return a&&b&&valid(a.y,a.m,a.d)&&iso(a.y,a.m,a.d)!==iso(b.y,b.m,b.d); });
      }).length;
      out.confirmed=out.ambiguous===0;
      if(out.confirmed) out.reason='Every date reads the same either way.';
      return out;
    }
    out.order=ok[0];
    out.confirmed=!mixed;
    out.reason=why||reasonFor(ok[0],nums);
    return out;
  }
  function reasonFor(order,nums){
    if(order==='DMY'&&nums.some(function(p){ return +p[0]>12; })) return 'A first part above 12 is a day.';
    if(order==='MDY'&&nums.some(function(p){ return +p[1]>12; })) return 'A middle part above 12 is a day.';
    return 'Only '+LABEL[order]+' reads every date.';
  }

  function parse(v,order){
    var s=shape(v);
    if(s.kind==='blank') return {ok:true,value:null};
    if(s.kind==='date') return {ok:true,value:iso(s.d.getUTCFullYear(),s.d.getUTCMonth()+1,s.d.getUTCDate())};
    if(s.kind==='serial'){
      if(s.n<20000||s.n>80000) return {ok:false};
      var d=new Date(Date.UTC(1899,11,30)+Math.floor(s.n)*86400000);
      return {ok:true,value:iso(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate())};
    }
    if(s.kind==='named') return valid(s.y,s.m,s.d)?{ok:true,value:iso(s.y,s.m,s.d)}:{ok:false};
    if(s.kind==='num'){
      // A four-digit first part is always year first, whatever the file order.
      var r=byOrder(s.p,s.p[0].length===4?'YMD':(order||'DMY'));
      return r&&valid(r.y,r.m,r.d)?{ok:true,value:iso(r.y,r.m,r.d)}:{ok:false};
    }
    return {ok:false};
  }
  function orderLabel(o){ return LABEL[o]||LABEL.DMY; }
  function example(o){
    return {DMY:'9/10/26 is 9-Oct-26',MDY:'10/9/26 is 9-Oct-26',YMD:'26/10/9 is 9-Oct-26'}[o]||'';
  }

  root.SRETDates={detect:detect,parse:parse,orderLabel:orderLabel,example:example,ORDERS:ORDERS.slice()};
})(window);

/* =====================================================================
   SRET user name and save history (Matt, 2026-09-28). No app globals.

   Who is using the file. A page opened from disk cannot read the computer's
   login name (browsers block it), so the name is asked once per computer,
   remembered on that computer (localStorage, like the theme), and the user
   confirms or changes it in Data settings.

   Two names are compared on every open:
     - this computer's user: remembered here, never travels with the file;
     - the file's last saver: saved inside the file with its save history.
   When a shared file is opened on another computer, the file still says who
   saved it last, but everything done now (imports, new milestones, saves)
   is recorded against this computer's user. The save history keeps every
   save: time, user, version.

   API (window.SRETUser):

/* =====================================================================
   SRET user task IDs and identity (Matt, 2026-09-29). No UI, no app globals.

   IDs people read: a prefix, a dash and a number, numbered within each
   prefix's own series. The default prefix is U + the user's initials:
     Matt Garrett  -> UMG-001, UMG-002        Jo Ruiz -> UJR-001
   The user can set their own prefix to group tasks, e.g. A100 while
   working on area 100 (A100-001, A100-002), then A200 (A200-001); going
   back to A100 carries on at A100-003. Prefix: 1 to 8 letters or digits,
   starting with a letter, stored in upper case. Initials: first letter of
   the first and last word of the confirmed user name (SRETUser); a
   one-word name gives its first two letters; no name gives UXX. Tasks
   created before this keep their USR-013 IDs.

   Identity for merging: every user task also carries a GUID, set once when
   it is created (or when an older task is first loaded) and never changed.
   Merging another file's tasks in, an incoming task whose ID is already
   here is
     - the same task (same GUID)          -> kept once, not duplicated
     - a different task (different GUID)  -> given the next free number in
       its own series (A100-004 stays A100-, USR-013 stays USR-), and every
       reference to it in the incoming data (predecessors, successors,
       annotation keys) is rewritten to match.
   This happens when two people use the same prefix. Older tasks without a GUID match when the ID, name and created
   date all agree; otherwise they are treated as different tasks.

   API (window.SRETIds):
     prefix(name)                   -> 'UMG'   ('Matt Garrett'), 'UDU' ('Demo user'), 'UXX' (no name): the default
     checkPrefix(p, scheduleIds)    -> {ok, value:'A100', warning} | {ok:false, error}
     next(existingIds, prefix, taken) -> 'A100-004' (one above the highest in that prefix's series)
     seriesOf(id)                   -> 'A100' for A100-004, null if not prefix-dash-number
     isUserId(id, prefixes)         -> true for USR-, U + two letters, or any prefix in the list
     guid()                         -> '3f2a9c1e-7b4d-4e8a-9f10-2c6d8e4b1a07' (random, version 4)
     ensureGuids(tasks)             -> number of older tasks given a GUID
     merge(local, incoming, opts)   -> {add, same, renamed:[{from,to,name,guid}], map:{from:to}}
        opts: {idKey:'id', refKeys:['pred','succ'], nameKey:'name', createdKey:'created'}
     rewriteKeys(obj, map)          -> copy of the incoming file's ID-keyed store (annotations), keys renamed
     rewriteRefs(text, map)         -> a predecessor/successor string with IDs renamed
   ===================================================================== */
(function(root){
  'use strict';
  // Any series: a prefix (starting with a letter), a dash, a number.
  var RX=/^([A-Z][A-Z0-9]{0,7})-(\d+)$/;
  var DEFAULT_RX=/^(U[A-Z]{2}|USR)-\d+$/;

  function prefix(name){
    var w=String(name||'').replace(/[^A-Za-z\s'-]/g,' ').trim().split(/[\s'-]+/).filter(Boolean);
    if(!w.length) return 'UXX';
    var s=w.length===1?(w[0]+'X').slice(0,2):w[0].charAt(0)+w[w.length-1].charAt(0);
    return 'U'+s.toUpperCase();
  }
  function checkPrefix(p,scheduleIds){
    var v=String(p==null?'':p).trim().toUpperCase().replace(/-+$/,'');
    if(!v) return {ok:false,error:'Enter a prefix, e.g. A100.'};
    if(!/^[A-Z][A-Z0-9]*$/.test(v)) return {ok:false,error:'Use letters and digits only, starting with a letter.'};
    if(v.length>8) return {ok:false,error:'Use 8 characters or fewer.'};
    var clash=(scheduleIds||[]).some(function(id){ return String(id).toUpperCase().indexOf(v+'-')===0; });
    return {ok:true,value:v,warning:clash?'Schedule activities already use '+v+'-. Task IDs will look like theirs.':''};
  }
  function seriesOf(id){ var m=RX.exec(String(id||'').toUpperCase()); return m?m[1]:null; }
  function isUserId(id,prefixes){
    var s=String(id||'').toUpperCase();
    if(DEFAULT_RX.test(s)) return true;
    var se=seriesOf(s); return !!se&&(prefixes||[]).map(function(x){ return String(x).toUpperCase(); }).indexOf(se)>=0;
  }
  function pad(n){ return String(n).padStart(3,'0'); }
  function seriesNext(series,ids){
    var max=0;
    ids.forEach(function(id){ var m=RX.exec(String(id||'').toUpperCase()); if(m&&m[1]===series) max=Math.max(max,+m[2]); });
    return series+'-'+pad(max+1);
  }
  function next(existing,pfx,taken){ return seriesNext(String(pfx||'UXX').toUpperCase(),(existing||[]).concat(taken||[])); }
  function guid(){
    try{ if(root.crypto&&root.crypto.randomUUID) return root.crypto.randomUUID(); }catch(e){}
    var b=new Uint8Array(16);
    try{ root.crypto.getRandomValues(b); }catch(e){ for(var k=0;k<16;k++) b[k]=Math.floor(Math.random()*256); }
    b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
    var h=Array.prototype.map.call(b,function(x){ return (x+256).toString(16).slice(1); }).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }
  function ensureGuids(tasks){ var n=0; (tasks||[]).forEach(function(t){ if(t&&!t.guid){ t.guid=guid(); n++; } }); return n; }

  function rewriteRefs(text,map){
    if(text==null||text==='') return text;
    return String(text).split(/([,;])/).map(function(tok){
      if(tok===','||tok===';') return tok;
      return tok.replace(/^(\s*)([^\s:]+)/,function(all,sp,id){ return sp+(map[id]||id); });
    }).join('');
  }
  function rewriteKeys(obj,map){
    var out={}; Object.keys(obj||{}).forEach(function(k){ out[map[k]||k]=obj[k]; }); return out;
  }
  function sameTask(a,b,o){
    if(a.guid&&b.guid) return a.guid===b.guid;
    return String(a[o.nameKey]||'')===String(b[o.nameKey]||'')&&String(a[o.createdKey]||'')===String(b[o.createdKey]||'');
  }
  function merge(local,incoming,opts){
    var o=Object.assign({idKey:'id',refKeys:['pred','succ'],nameKey:'name',createdKey:'created'},opts||{});
    var byId={}; (local||[]).forEach(function(t){ byId[t[o.idKey]]=t; });
    var taken=Object.keys(byId), map={}, res={add:[],same:[],renamed:[],map:map};
    var copies=(incoming||[]).map(function(t){ return Object.assign({},t); });
    // IDs used by the incoming file itself also count as taken.
    copies.forEach(function(t){ taken.push(t[o.idKey]); });
    copies.forEach(function(t){
      var id=t[o.idKey], here=byId[id];
      if(!here){ res.add.push(t); return; }
      if(sameTask(here,t,o)){ res.same.push(t); return; }
      // A different task under the same ID: the next free number in its own series.
      var nid=seriesNext(seriesOf(id)||'USR',taken);
      taken.push(nid); map[id]=nid; t[o.idKey]=nid;
      res.renamed.push({from:id,to:nid,name:t[o.nameKey]||'',guid:t.guid||''});
      res.add.push(t);
    });
    // References inside the incoming tasks follow the renames.
    if(Object.keys(map).length) res.add.concat(res.same).forEach(function(t){ o.refKeys.forEach(function(k){ if(k in t) t[k]=rewriteRefs(t[k],map); }); });
    return res;
  }

  root.SRETIds={prefix:prefix,checkPrefix:checkPrefix,seriesOf:seriesOf,isUserId:isUserId,guid:guid,next:next,ensureGuids:ensureGuids,merge:merge,rewriteKeys:rewriteKeys,rewriteRefs:rewriteRefs};
})(window);

/* =====================================================================
   SRET stored-key migration (Matt, 2026-09-28). No UI, no app globals.

   "User milestones" are renamed "user tasks" everywhere, including the
   keys and values saved in files, so names and storage stay in sync. Files
   saved before the rename still open: every load path runs its payload
   through here first, which rewrites the old keys and values to the new
   ones. Saving always writes the new names only.

     payload key    userMilestones          -> userTasks
     payload key    userMsEnabled           -> userTasksEnabled
     source value   'User-defined'          -> 'User tasks'   (sourceSchedule / source)
     band value     'User Defined Milestones' -> 'User Tasks' (row notes / band)
     setting        sret-ws-section 'userms' -> 'usertasks'
     export sheet   'User-defined'          -> 'User tasks'

   Pure and idempotent: a payload already in the new names comes back
   unchanged, with nothing reported. The input is never mutated.

   API (window.SRETMigrate):
     userTasks(payload)   -> {payload, changed:[...notes], conflicts:[...notes]}
     value(v)             -> the new value for an old source or band value, else v
     wsSection(v)         -> 'usertasks' for 'userms', else v
     sheetName(name)      -> true when name is the user tasks sheet, old or new
     KEYS                 -> the tables above
   ===================================================================== */
(function(root){
  'use strict';
  var KEYS={
    payload:{userMilestones:'userTasks',userMsEnabled:'userTasksEnabled'},
    values:{'User-defined':'User tasks','User Defined Milestones':'User Tasks'},
    wsSection:{userms:'usertasks'},
    sheet:{old:'User-defined',now:'User tasks'}
  };
  // Fields that carry a source or band value, on tasks, rows and milestones.
  var VALUE_FIELDS=['source','sourceSchedule','notes','band'];

  function clone(x){ return x==null?x:JSON.parse(JSON.stringify(x)); }
  function value(v){ return typeof v==='string'&&Object.prototype.hasOwnProperty.call(KEYS.values,v)?KEYS.values[v]:v; }
  function wsSection(v){ return KEYS.wsSection[v]||v; }
  function sheetName(n){ var s=String(n||'').trim().toLowerCase(); return s===KEYS.sheet.old.toLowerCase()||s===KEYS.sheet.now.toLowerCase(); }

  function fixRecords(list,where,changed){
    var n=0;
    (list||[]).forEach(function(r){
      if(!r||typeof r!=='object') return;
      VALUE_FIELDS.forEach(function(f){ var v=value(r[f]); if(v!==r[f]){ r[f]=v; n++; } });
    });
    if(n) changed.push(where+': '+n+' value'+(n===1?'':'s')+' renamed');
  }
  function userTasks(payload){
    var out={payload:payload,changed:[],conflicts:[]};
    if(!payload||typeof payload!=='object') return out;
    var p=clone(payload);
    Object.keys(KEYS.payload).forEach(function(oldK){
      var newK=KEYS.payload[oldK];
      if(!(oldK in p)) return;
      if(newK in p) out.conflicts.push('Both '+oldK+' and '+newK+' present; kept '+newK+'.');
      else { p[newK]=p[oldK]; out.changed.push(oldK+' -> '+newK); }
      delete p[oldK];
    });
    fixRecords(p.userTasks,'userTasks',out.changed);
    fixRecords(p.userRows,'userRows',out.changed);
    fixRecords(p.tasks,'tasks',out.changed);
    fixRecords(p.milestones,'milestones',out.changed);
    // Registered sources (publish state) carry the source name too.
    (p.sources||[]).forEach(function(s){ if(s&&typeof s==='object'){ var v=value(s.name); if(v!==s.name){ s.name=v; out.changed.push('sources: '+s.id+' renamed'); } } });
    out.payload=out.changed.length||out.conflicts.length?p:payload;
    return out;
  }

  root.SRETMigrate={userTasks:userTasks,value:value,wsSection:wsSection,sheetName:sheetName,KEYS:KEYS};
})(window);

/* =====================================================================
   SRET milestone import rules (Matt, 2026-09-27). Pure checks over a parsed
   sheet; no UI, no app globals. The grid's Import milestones dialog uses
   it, and the app's own import path can hand it the same array-of-arrays.

   Rules:
     - The file must have an ID column and at least one row.
     - Duplicate IDs within the file block the import: only unique IDs and
       blank IDs are allowed.
     - A row whose ID is already in the table is not imported (skipped).
     - A blank ID is assigned by the application when the row is added.
     - Predecessors and successors must name an ID that exists (in the
       app, or in the file). Missing ones are listed per row, comma
       separated, and the user is asked whether to continue.
     - Other fields are checked the same way: a date, number or choice that
       cannot be read is left blank, listed, and the user is asked.
     - Dates: the order (day, month or year first) is worked out from every
       date in the file by the shared SRETDates engine. When the file cannot
       settle it and some dates would read differently, the user is asked.
     - If the user continues, every issue goes to the Import log with the
       import time, file, user and note.

   API (window.SRETMsImport):
     parseFile(file, ensureXLSX) -> Promise<aoa>   (.csv built in, .xlsx via SheetJS)
     parseCsv(text)             -> aoa
     check(aoa, cfg)            -> result          (see below)
     logEntries(result, meta)   -> [{time,file,user,id,field,note}]
     summary(result, assigned, noun) -> [sentences]; noun ['task','tasks'], default milestone
   cfg: { columns:[{key,label,type,options,min,max}], idKey, depKeys:{pred:'Predecessors',...},
          existingIds:[...], knownIds:[...], dateOrder:'auto'|'DMY'|'MDY'|'YMD' }
   result.dates: {order, chosen, confirmed, reason, numeric, ambiguous, ask}
   ===================================================================== */
(function(root){
  'use strict';

  function norm(v){ return v==null?'':String(v).replace(/\s+/g,' ').trim(); }
  function idNorm(v){ return norm(v).toUpperCase(); }
  function toNumber(v,col){
    if(v==null||norm(v)==='') return {ok:true,value:null};
    var n=Number(norm(v).replace(/%$/,''));
    if(!isFinite(n)) return {ok:false,why:'is not a number'};
    if(col.min!=null&&n<col.min||col.max!=null&&n>col.max) return {ok:false,why:'is outside '+col.min+' to '+col.max};
    return {ok:true,value:n};
  }
  function toOption(v,col){
    if(v==null||norm(v)==='') return {ok:true,value:null};
    var s=norm(v).toLowerCase(), opts=col.options||[];
    for(var i=0;i<opts.length;i++){
      var o=opts[i], val=o&&typeof o==='object'?o.value:o, lab=o&&typeof o==='object'?o.label:o;
      if(String(val).toLowerCase()===s||String(lab).toLowerCase()===s) return {ok:true,value:val};
    }
    return {ok:false,why:'is not one of '+opts.map(function(o){ return o&&typeof o==='object'?o.label:o; }).join(', ')};
  }
  function depIds(v){
    return norm(v).split(/[,;]+/).map(function(t){ return idNorm(t.split(/[:\s]/).filter(Boolean)[0]||''); }).filter(Boolean);
  }

  // RFC 4180 style: quoted fields, doubled quotes, CR/LF line ends.
  function parseCsv(text){
    var rows=[], row=[], f='', q=false, i=0, c;
    text=String(text).replace(/^﻿/,'');
    for(;i<text.length;i++){
      c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
      else if(c==='"') q=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
      else f+=c;
    }
    if(f!==''||row.length){ row.push(f); rows.push(row); }
    return rows;
  }
  function parseFile(file,ensureXLSX){
    if(!file) return Promise.reject(new Error('Choose a file first.'));
    var name=file.name||'';
    if(/\.csv$/i.test(name)) return file.text().then(parseCsv);
    if(!/\.xlsx?$/i.test(name)) return Promise.reject(new Error('Use an .xlsx or .csv file. "'+name+'" is neither.'));
    var loader=typeof ensureXLSX==='function'?ensureXLSX:function(){ return Promise.resolve(); };
    return Promise.all([Promise.resolve().then(loader),file.arrayBuffer()]).then(function(r){
      var X=r[0]||root.XLSX;
      if(!X||!X.read) throw new Error('The Excel library is not available, so .xlsx files cannot be read. Save the sheet as .csv and import that instead.');
      var wb=X.read(r[1],{type:'array',cellDates:true});
      var ws=wb.Sheets[wb.SheetNames[0]];
      return X.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',dateNF:'d-mmm-yy'});
    });
  }

  function check(aoa,cfg){
    var res={fatal:null,rows:[],skipped:[],issues:[],depIssueRows:0,fieldIssueRows:0,unknownColumns:[]};
    aoa=(aoa||[]).map(function(r){ return (r||[]).map(function(v){ return v; }); });
    var h=0; while(h<aoa.length&&!aoa[h].some(function(v){ return norm(v)!==''; })) h++;
    if(h>=aoa.length){ res.fatal='The file is empty.'; return res; }
    var head=aoa[h].map(norm), map={}, byLabel={};
    cfg.columns.forEach(function(c){ byLabel[norm(c.label).toLowerCase()]=c; byLabel[String(c.key).toLowerCase()]=c; });
    head.forEach(function(t,i){ var c=byLabel[t.toLowerCase()]; if(c) map[i]=c; else if(t) res.unknownColumns.push(t); });
    var idCol=null; for(var k in map) if(map[k].key===cfg.idKey) idCol=+k;
    if(idCol==null){ res.fatal='The file has no "'+(cfg.columns.filter(function(c){ return c.key===cfg.idKey; })[0]||{label:'ID'}).label+
      '" column. Use Download import template for the expected columns.'; return res; }
    var data=[];
    for(var r=h+1;r<aoa.length;r++){
      if(!aoa[r].some(function(v){ return norm(v)!==''; })) continue;
      data.push({rowNum:r+1,cells:aoa[r]});
    }
    if(!data.length){ res.fatal='The file has no rows to import.'; return res; }
    // Duplicate IDs within the file block the import.
    var seen={};
    data.forEach(function(d){ var id=idNorm(d.cells[idCol]); if(id) (seen[id]=seen[id]||[]).push(d.rowNum); });
    var dup=Object.keys(seen).filter(function(id){ return seen[id].length>1; });
    if(dup.length){
      res.fatal='There are duplicate activity IDs within the list: '+dup.map(function(id){ return id+' (rows '+seen[id].join(', ')+')'; }).join('; ')+
        '. Only unique IDs, or blank IDs, can be imported.';
      res.duplicates=dup; return res;
    }
    // Date order, from every date cell in the file together.
    var D=root.SRETDates, dateCols=Object.keys(map).filter(function(i){ return map[i].type==='date'; }), dv=[];
    data.forEach(function(d){ dateCols.forEach(function(i){ dv.push(d.cells[i]); }); });
    var chosen=cfg.dateOrder&&cfg.dateOrder!=='auto'?cfg.dateOrder:null, det=D.detect(dv);
    res.dates={order:chosen||det.order,chosen:chosen?'user':'auto',confirmed:chosen?true:det.confirmed,reason:chosen?'Chosen in the dialog.':det.reason,
               numeric:det.numeric,ambiguous:det.ambiguous,ask:!chosen&&!det.confirmed};
    var existing={}; (cfg.existingIds||[]).forEach(function(id){ existing[idNorm(id)]=1; });
    var valid={}; Object.keys(existing).forEach(function(id){ valid[id]=1; });
    (cfg.knownIds||[]).forEach(function(id){ valid[idNorm(id)]=1; });
    Object.keys(seen).forEach(function(id){ valid[id]=1; });
    data.forEach(function(d){
      var idRaw=norm(d.cells[idCol]), id=idNorm(idRaw);
      if(id&&existing[id]){ res.skipped.push({rowNum:d.rowNum,id:idRaw}); return; }
      var row={}, notes=[], dep=false;
      Object.keys(map).forEach(function(i){
        var c=map[i], v=d.cells[i], out;
        if(c.key===cfg.idKey){ row[c.key]=idRaw||null; return; }
        if(c.type==='date'){ out=D.parse(v,res.dates.order); if(!out.ok) out.why='is not a valid date'+(/^\s*\d{1,2}\D+\d{1,2}\D+\d{2,4}\s*$/.test(norm(v))?' (read as '+D.orderLabel(res.dates.order)+')':''); }
        else if(c.type==='number') out=toNumber(v,c);
        else if(c.type==='select') out=toOption(v,c);
        else out={ok:true,value:norm(v)};
        if(!out.ok){
          notes.push({field:c.key,note:c.label+' "'+norm(v)+'" '+(out.why||'is not a valid date')+'. Left blank.'});
          row[c.key]=null; return;
        }
        row[c.key]=out.value;
      });
      Object.keys(cfg.depKeys||{}).forEach(function(k){
        if(!(k in row)||!row[k]) return;
        var missing=depIds(row[k]).filter(function(x){ return !valid[x]; });
        if(missing.length){ dep=true; notes.push({field:k,note:cfg.depKeys[k]+' not found: '+missing.join(', ')}); }
      });
      if(dep) res.depIssueRows++;
      if(notes.some(function(n){ return !(n.field in (cfg.depKeys||{})); })) res.fieldIssueRows++;
      notes.forEach(function(n){ res.issues.push({rowNum:d.rowNum,id:idRaw||null,field:n.field,note:n.note}); });
      res.rows.push({rowNum:d.rowNum,data:row});
    });
    if(!res.rows.length&&res.skipped.length) res.fatal='Nothing to import: every ID in the file is already in the table ('+res.skipped.map(function(s){ return s.id; }).join(', ')+').';
    return res;
  }

  // meta: {time, file, user, assigned: {rowNum: id}}
  function logEntries(res,meta){
    return res.issues.map(function(i){
      return {time:meta.time,file:meta.file,user:meta.user,id:i.id||(meta.assigned&&meta.assigned[i.rowNum])||'',
              row:i.rowNum,field:i.field,note:i.note};
    });
  }
  function plural(n,w){ return n+' '+w+(n===1?'':'s'); }
  function summary(res,assigned,noun){
    var ids=Object.keys(assigned||{}).map(function(k){ return assigned[k]; }), w=noun||['milestone','milestones'];
    var out=['Imported '+res.rows.length+' '+(res.rows.length===1?w[0]:w[1])+'.'];
    if(res.dates&&res.dates.numeric) out.push('Dates read as '+root.SRETDates.orderLabel(res.dates.order)+'. '+res.dates.reason);
    if(ids.length) out.push('IDs assigned to '+plural(ids.length,'row')+' with a blank ID: '+ids.join(', ')+'.');
    if(res.skipped.length) out.push('Skipped '+plural(res.skipped.length,'row')+' already in the table: '+res.skipped.map(function(s){ return s.id; }).join(', ')+'.');
    if(res.issues.length) out.push(plural(res.issues.length,'issue')+' recorded in the Import log.');
    return out;
  }

      s.onerror=function(){ rej(new Error('Excel export needs the SheetJS library, which is fetched from a CDN the first time it is used, and that request was blocked or failed.')); };
      document.head.appendChild(s);
    });
  }
  function patch(list,keyName,key,field,value){
    for(var i=0;i<list.length;i++) if(list[i][keyName]===key){ list[i]=Object.assign({},list[i]); list[i][field]=value; return; }
  }
  var host=document.getElementById('demo-board');
  // One lists store for every screen, as the app will hold one: saved lists
  // in the annotation layer, My temp list as session working state.
  // The same activity reached from two screens is one item.
  var lstore=window.DEMO_LISTS=SRETCollections.newStore();
  SRETCollections.create(lstore,'Site walk 3-Oct','2026-09-27T00:00:00Z');
  SRETCollections.create(lstore,'Owner review items','2026-09-27T00:00:00Z');
  // Names for the temp list panel, from any screen's data (the app would read its stores).
  var LABELS={};
  F.sched.concat(F.usertasks).forEach(function(r){ LABELS['activity:'+r.id]=r.id+'  '+r.name; });
  F.annot.forEach(function(r){ LABELS['annot:'+r.aid]=r.aid+'  '+r.kind+' on '+r.target; });
  function labelOf(ref){ return LABELS[ref]||(/^activity:(.*)-\d\d$/.test(ref)?LABELS[ref.replace(/-\d\d$/,'')]+' (stress copy)':''); }
  function listsOpt(refOf){ return {store:lstore,refOf:refOf,labelOf:labelOf,onChange:function(r){ log('onListsChange',[r.kind||'create']); }}; }
  var ACT=function(k){ return 'activity:'+k; }, ANN=function(k){ return 'annot:'+k; };
  // Next user milestone ID: one above the highest USR number in the store,
  // the rule the app's nextUserMsId() follows, shared by Add row and import.
  // taken: IDs already handed out in the same import, not yet in the store.
  // New user task IDs: the user's prefix + number (Matt, 2026-09-29). Default
  // prefix U + initials (UDU for Demo user); the user can set e.g. A100.
  function taskIds(){ return store.usertasks.map(function(r){ return r.id; }); }
  function nextUsr(taken){ return SRETIds.next(taskIds(),USERS.idPrefix(),taken); }
  var PREFIX_OPTS={nextId:function(p){ return SRETIds.next(taskIds(),p); },scheduleIds:function(){ return F.sched.map(function(r){ return r.id; }); }};
  function openPrefix(){ SRETGrid.dialog('Task ID prefix',function(body){ return SRETUser.buildPrefixField(body,USERS,Object.assign({heading:false},PREFIX_OPTS)).destroy; }); }
  var TODAY=new Date().toISOString().slice(0,10);
  // Who is using the file (SRETUser). The fixture file was last saved by
  // someone else, as when a published file is shared and opened elsewhere.
  var USERS=window.DEMO_USER=SRETUser.create({file:F.fileState});
  function userName(){ return USERS.name(); }
  function showUser(){ var st=USERS.status(); var c=document.getElementById('demo-user');
    c.textContent=st.state==='unset'?'Name not set':'Working as '+st.name+(st.state==='other'?', last saved by '+st.savedBy:''); c.title=st.message; }
  USERS.onChange(showUser);
  // Stand-in for Data and view > Data settings: the name field, the save history and a Save.
  function settingsInto(body){
    var f=SRETUser.buildField(body,USERS,{prefix:PREFIX_OPTS});
    var save=document.createElement('button'); save.type='button'; save.className='sg-btn'; save.textContent='Save file (demo)';
    save.setAttribute('data-sg','demo-save'); save.addEventListener('click',function(){ var e=USERS.recordSave({version:'grid demo'}); log('onSave',[e.by]); });
    body.appendChild(save);
    return f.destroy;
  }
  function openSettings(title){
    if(SRETGrid.isOpen()) return SRETGrid.dialog(title||'Data settings',settingsInto);
    var box=document.getElementById('demo-settings-box'); box.innerHTML=''; settingsInto(box); box.querySelector('input').focus();
  }
  var IMPORT_LOG=window.DEMO_IMPORT_LOG=[];
  // Stand-in for the app's milestone dialog (openMsDialog), opened by double-clicking an ID.
  function openMilestone(id){
    log('onOpenItem',[id]);
    var r=store.usertasks.filter(function(x){ return x.id===id; })[0]; if(!r) return;
    SRETGrid.dialog('Task '+id,function(body){
      var dl=document.createElement('dl'); dl.className='demo-ms'; dl.setAttribute('data-sg','demo-ms-form');
      F.cols.usertasks.forEach(function(c){
        var dt=document.createElement('dt'); dt.textContent=c.label;
        var dd=document.createElement('dd'); var v=r[c.key];
        dd.textContent=v==null||v===''?'Not set':(c.options?((c.options.filter(function(o){ return String(o.value!=null?o.value:o)===String(v); })[0]||{}).label||v):v);
        dl.appendChild(dt); dl.appendChild(dd);
      });
      var note=document.createElement('p'); note.className='demo-import-note';
      note.textContent='Stand-in for the dashboard milestone form. In the app, double-click opens that same form.';
      body.appendChild(note); body.appendChild(dl);
    });
  }
  var back=function(){ log('onBack',[]); };
  // Views reached from the title (Matt, 2026-09-28). Schedule milestones are
  // zero-duration activities; Schedule updates are schedule rows carrying an
  // annotation (short title, health or comment).
  function hasAnnot(r){ return !!(r.short||r.comment||(r.health!=null&&r.health!=='')); }
  // Schedule changes: earlier imports kept as snapshots (SRETCompare). The
  // current project update is the live schedule store.
  var C=window.SRETCompare;
  // Loaded schedules: three per schedule line plus the embedded baseline.
  // The live 29-Aug update is imported last as the latest.
  var CST=window.DEMO_CMP=C.newStore();
  F.snaps.forEach(function(x){ C.receive(CST,x.meta,x.rows,x.slot); });
  var LOADED=C.receive(CST,{id:'pu-0829',role:'project',dataDate:'2026-08-29',file:'103787-13_PFS_Weekly_Update_DD-2026-08-29.xlsx',
    path:'P:\\103787 SRET\\05 Controls\\Schedule\\Weekly updates',snapshotAt:'2026-08-31T08:00:00Z'},store.sched,'primary');
  log('onScheduleLoaded',['pu-0829','released '+(LOADED.released.map(function(x){ return x.id; }).join(',')||'none')]);
  var CMP=window.DEMO_CMP_STATE={cur:'pu-0829',basis:null};   // basis null = the default for the chosen schedule
  function changesData(){
    var all=C.list(CST), cur=all.filter(function(s){ return s.id===CMP.cur; })[0];
    var bs=C.bases(CST,cur), basis=CMP.basis?(bs.filter(function(b){ return b.snap.id===CMP.basis; })[0]||{}).snap:C.defaultBasis(CST,cur);
    return {all:all,cur:cur,bases:bs,basis:basis,result:C.compare(basis,cur)};
  }
  var CHANGE_COLS=[{key:'id',label:'Activity ID',type:'text',width:110},{key:'name',label:'Name',type:'text',width:240},
    {key:'change',label:'Change',type:'text',width:100,tones:{Later:'crit',Earlier:'track',Completed:'done',New:'future',Removed:'risk','Float only':'future','Only in interim':'future'}},
    {key:'finishWas',label:'Finish was',type:'date',width:96},{key:'finishNow',label:'Finish now',type:'date',width:96},
    {key:'finishSlip',label:'Finish moved (days)',type:'number',width:110},
    {key:'startWas',label:'Start was',type:'date',width:96},{key:'startNow',label:'Start now',type:'date',width:96},
    {key:'startSlip',label:'Start moved (days)',type:'number',width:110},
    {key:'floatWas',label:'Float was',type:'number',width:80},{key:'floatNow',label:'Float now',type:'number',width:80},
    {key:'floatChange',label:'Float change',type:'number',width:90}];
  var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dmy(iso){ if(!iso) return ''; var p=iso.slice(0,10).split('-'); return (+p[2])+'-'+MONS[+p[1]-1]+'-'+p[0].slice(2); }
  // Stored uploads and the reference table that designates them (Matt,
  // 2026-09-28: "set this source as the primary" is one row in a table).
  var DES_LABEL={primary:'Primary',secondary:'Secondary',alternate:'Alternate',interim:'Not designated (interim)',none:'Not designated',baseline:'Baseline (embedded)'};
  function openLoaded(){
    SRETGrid.dialog('Loaded schedules',function(body){
      function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
      function render(){
        body.innerHTML='';
        var h1=el('h4','demo-h','Designations'); body.appendChild(h1);
        var rt=el('table','sg-itable'); rt.setAttribute('data-sg','ref-table');
        rt.innerHTML='<thead><tr><th>Schedule</th><th>Designation</th><th>Upload</th></tr></thead>';
        var rb=el('tbody');
        C.table(CST).forEach(function(r){ var tr=el('tr'), up=r.upload&&CST.uploads[r.upload];
          [r.lineName,DES_LABEL[r.designation],up?up.file+', DD '+dmy(up.dataDate):'None'].forEach(function(v){ tr.appendChild(el('td',null,v)); }); rb.appendChild(tr); });
        rt.appendChild(rb); body.appendChild(rt);
        body.appendChild(el('h4','demo-h','Stored uploads'));
        var t=el('table','sg-itable'); t.setAttribute('data-sg','loaded-table');
        var hd=['Upload','Covers','Data date','Snapshot taken','File','Location','Activities','Set as'];
        t.innerHTML='<thead><tr>'+hd.map(function(x){ return '<th>'+x+'</th>'; }).join('')+'</tr></thead>';
        var tb=el('tbody');
        C.record(CST).forEach(function(r){ var tr=el('tr'), up=CST.uploads[r.id];
          [r.id,r.partial?'Part: '+up.scope:'Full schedule',dmy(r.dataDate),dmy(r.snapshotAt)+' '+r.snapshotAt.slice(11,16),r.file,r.path,String(r.activities)].forEach(function(v){ tr.appendChild(el('td',null,v)); });
          var td=el('td'), sel=el('select','sg-select'); sel.setAttribute('data-sg','set-as-'+r.id); sel.setAttribute('aria-label','Set '+r.file+' as');
          if(r.designation==='baseline'){ sel.appendChild(el('option',null,DES_LABEL.baseline)); sel.disabled=true; }
          else [['primary','Primary'],['secondary','Secondary'],['alternate','Alternate'],['','Not designated']].forEach(function(o){
            var op=el('option',null,o[1]); op.value=o[0]; if(o[0]==='primary'&&up.partial) op.disabled=true;
            if(o[0]===r.designation||(!o[0]&&(r.designation==='none'||r.designation==='interim'))) op.selected=true; sel.appendChild(op); });
          sel.addEventListener('change',function(){
            var res=C.designate(CST,r.id,sel.value||null); log('onDesignate',[r.id,sel.value||'none',res.ok?'ok':res.error]);
            render(); if(!res.ok){ var m=body.querySelector('[data-sg=designate-error]'); m.hidden=false; m.textContent=res.error; } });
          td.appendChild(sel); tr.appendChild(td); tb.appendChild(tr); });
        t.appendChild(tb); body.appendChild(t);
        var err=el('p','demo-import-note'); err.setAttribute('data-sg','designate-error'); err.setAttribute('role','alert'); err.hidden=true; body.appendChild(err);
        body.appendChild(el('p','demo-import-note','Designations point at stored uploads; changing one moves nothing. Importing a new primary makes the old primary the secondary. On each import, uploads with no designation are released, except the latest interim of each scope. An interim covers part of the schedule and cannot be the primary.'));
      }
      render();
      // Views read the table when they open: refresh Schedule changes on close.
      return function(){ var all=C.list(CST); if(!all.some(function(s){ return s.id===CMP.cur; })) CMP.cur=(C.list(CST)[0]||{}).id; CMP.basis=null; setTimeout(function(){ if(SRETGrid.isOpen()){ var c=CONFIGS.changes(); window.DEMO_LAST_ROWS=c.rows; SRETGrid.refresh(c); } },0); };
    },{wide:true});
  }
  function changesCfg(){
    var d=changesData();
    return Object.assign({title:'Schedule changes',rowKey:'id',editable:false,exportName:'Schedule changes',
      columns:CHANGE_COLS,rows:d.result.rows,lists:listsOpt(ACT),
      toolsItems:[{label:'Loaded schedules…',sg:'loaded',onSelect:openLoaded}],
      pickers:[
        {sg:'cmp-cur',label:'Schedule',items:d.all.filter(function(s){ return s.slot!=='baseline'; })
          .map(function(s){ return {id:s.id,label:C.label(s),checked:s.id===d.cur.id}; }),
          onSelect:function(id){ CMP.cur=id; CMP.basis=null; log('onCompare',[id,'default']); window.DEMO_OPEN('changes'); }},
        {sg:'cmp-basis',label:'Compared with',items:d.bases.map(function(b){ return {id:b.snap.id,label:b.label+(b.isDefault?' (default)':''),checked:b.snap===d.basis}; }),
          onSelect:function(id){ CMP.basis=id; log('onCompare',[CMP.cur,id]); window.DEMO_OPEN('changes'); }}],
      note:d.basis?C.summary(d.result)+' Calendar days; positive is later.':d.bases.length?'Nothing older is loaded for this schedule. Choose a schedule under Compared with.':'Nothing loaded to compare this schedule with yet.',
      pin:['id','name'],onBack:back,ensureXLSX:ensureXLSX,host:host},viewsOpt('changes'));
  }
  // Schedule milestones: every activity from an uploaded schedule (the board
  // plots each as a milestone). User tasks are the user's own items.
  function viewsOpt(cur){
    return {view:cur,onView:function(id){ log('onView',[id]); window.DEMO_OPEN(id); },
      views:[{id:'usertasks',label:'User tasks',count:store.usertasks.length},
             {id:'schedms',label:'Schedule milestones',count:store.sched.length},
             {id:'schedupd',label:'Schedule updates',count:store.sched.filter(hasAnnot).length},
             {id:'changes',label:'Schedule changes',count:changesData().result.rows.length},
             {id:'annot',label:'Comments and markups',count:store.annot.length}]};
  }
  function schedView(title,rows,cur){ return Object.assign({
      title:title,rowKey:'id',editable:true,exportName:title,
      columns:F.cols.sched,rows:rows,lists:listsOpt(ACT),
      onEdit:function(k,f,v){ log('onEdit',[k,f,v]); patch(store.sched,'id',k,f,v); },
      pin:['id','name'],onBack:back,ensureXLSX:ensureXLSX,host:host},viewsOpt(cur)); }
  var CONFIGS={
    usertasks:function(){ return {
      title:'User tasks',rowKey:'id',editable:true,exportName:'User tasks',
      columns:F.cols.usertasks,rows:store.usertasks.slice(),lists:listsOpt(ACT),
      onEdit:function(k,f,v){ log('onEdit',[k,f,v]);
        if(f==='progress' && v!=null && (v<0||v>100)) return false;   // app-side rule: 0 to 100
        patch(store.usertasks,'id',k,f,v); },
      onAdd:function(){ var id=nextUsr(); var r={id:id,guid:SRETIds.guid(),name:'New task',type:'MS',state:'FUTURE',progress:0,
          start:null,finish:null,band:'User Tasks',wbs:'',pred:'',succ:'',comment:'',created:TODAY,createdBy:userName(),health:0};
        store.usertasks.push(r); log('onAdd',[id]); return r; },
      onDelete:function(keys){ log('onDelete',[keys]); store.usertasks=store.usertasks.filter(function(r){ return keys.indexOf(r.id)<0; }); },
      toolsItems:[{label:'Task ID prefix…',sg:'prefix',onSelect:openPrefix}],
      // IDs a predecessor or successor may name: the schedule and the user tasks.
      refOptions:function(){ return F.sched.map(function(r){ return {id:r.id,name:r.name}; })
        .concat(store.usertasks.map(function(r){ return {id:r.id,name:r.name}; })); },
      openColumn:'id',onOpenItem:openMilestone,view:'usertasks',views:viewsOpt('usertasks').views,onView:viewsOpt('usertasks').onView,
      importer:{noun:['task','tasks'],idKey:'id',depKeys:{pred:'Predecessors',succ:'Successors'},user:userName,log:IMPORT_LOG,nextId:nextUsr,
        // IDs a dependency may name: every schedule activity and user milestone the app knows.
        knownIds:function(){ return F.sched.map(function(r){ return r.id; }).concat(store.usertasks.map(function(r){ return r.id; })); },
        onCommit:function(rows){
          var out=rows.map(function(r){ var o=Object.assign({name:'',type:'MS',state:'FUTURE',progress:0,band:'User Tasks',
            wbs:'',pred:'',succ:'',comment:'',health:0},r); o.created=TODAY; o.createdBy=userName(); o.guid=SRETIds.guid(); if(o.health==null) o.health=0;
            if(!o.band) o.band='User Tasks'; return o; });
          out.forEach(function(o){ store.usertasks.push(o); });
          log('onImportCommit',[out.map(function(o){ return o.id; })]);
          return out; }},
      pin:['id','name'],onBack:back,ensureXLSX:ensureXLSX,host:host}; },
    annot:function(){ return {
      title:'Comments and markups: W/E 27-Sep-26',rowKey:'aid',editable:true,exportName:'Comments and markups W-E 27-Sep-26',
      columns:F.cols.annot,rows:store.annot.slice(),lists:listsOpt(ANN),
      onEdit:function(k,f,v){ log('onEdit',[k,f,v]); patch(store.annot,'aid',k,f,v); },
      onDelete:function(keys){ log('onDelete',[keys]); store.annot=store.annot.filter(function(r){ return keys.indexOf(r.aid)<0; }); },
      pin:['id','name'],onBack:back,ensureXLSX:ensureXLSX,host:host,view:'annot',views:viewsOpt('annot').views,onView:viewsOpt('annot').onView}; },
    changes:changesCfg,
    sched:function(){ return schedView('Schedule milestones',store.sched.slice(),'schedms'); },
    schedms:function(){ return schedView('Schedule milestones',store.sched.slice(),'schedms'); },
    schedupd:function(){ return schedView('Schedule updates',store.sched.filter(hasAnnot),'schedupd'); },
    stress:function(){ return {
      title:'Schedule milestones (2,000 row stress set)',rowKey:'id',editable:true,exportName:'Stress',
      columns:F.cols.sched,rows:window.SRET_STRESS(2000),lists:listsOpt(ACT),
      onEdit:function(k,f,v){ log('onEdit',[k,f,v]); },
      pin:['id','name'],onBack:back,ensureXLSX:ensureXLSX,host:host}; }
  };
  // DEMO_LAST_ROWS is the exact array handed to open(), so the check can prove
  // the grid never mutates the caller's objects.
  window.DEMO_OPEN=function(name){ var c=CONFIGS[name](); window.DEMO_LAST_ROWS=c.rows; return SRETGrid.open(c); };
  ['usertasks','annot','sched','stress'].forEach(function(n){
    document.getElementById('go-'+n).addEventListener('click',function(){ window.DEMO_OPEN(n); });
  });
  var tb=document.getElementById('demo-theme');
  tb.addEventListener('click',function(){
    var dark=document.documentElement.getAttribute('data-theme')!=='dark';
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    tb.setAttribute('aria-pressed',String(dark)); tb.textContent=dark?'Light theme':'Dark theme';
  });
  // Opens on User tasks so a reviewer (and the palette swap check) sees
  // the grid at load; #home opens the launcher instead.
  document.getElementById('demo-settings').addEventListener('click',function(){ openSettings(); });
  showUser();
  if(location.hash!=='#home') window.DEMO_OPEN('usertasks');
  // First use on this computer: ask for the name (confirm or change it later in Data settings).
  if(USERS.status().state==='unset') openSettings('Who is using this file?');
})();
</script>
