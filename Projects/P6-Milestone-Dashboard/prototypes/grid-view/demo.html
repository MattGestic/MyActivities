     with it. These aliases resolve per theme because :root and the theme
     blocks both target <html>, so the status token they point at already
     carries its themed value at substitution time. Point one of these at a
     different value to restyle an icon state on its own. */
  --color-icon-done:var(--color-text-ink);
  /* Green, against the ink above it. The two finished states differ by colour
     and by nothing else, so the token pair is where that difference lives. */
  --color-icon-doneuser:var(--color-status-done);

  /* ===== Spacing scale =====
     8 steps, built from what the file already mostly used (multiples of 2/4px),
     not a fresh invented scale — the goal is real structure going forward, not
     a rewrite of every value that was already close enough. */
  --space-0:0;
  --space-1:2px;   /* hairline — icon-to-text gaps, tag internal padding */
  --space-2:4px;   /* tight — small button padding, inline gaps */
  --space-3:6px;   /* default — most control gaps, standard padding */
  --space-4:8px;   /* comfortable — form field spacing */
  --space-5:12px;  /* loose — section-internal spacing */
  --space-6:16px;  /* component/section separation */
  --space-7:24px;  /* app-level outer margins */

     spacing), not a named token for every possible role — that's the
     "overly prescriptive" trap the brief specifically warned against. */
  --space-label-gap:var(--space-2);      /* between a label and the control it describes */
  --space-btn-padding-x:var(--space-3);
  --space-btn-padding-y:var(--space-1);
  --space-section-gap:var(--space-5);    /* between stacked sections in a panel */
  --space-app-margin:var(--space-6);     /* outer page/panel margins */

  --label-scale:1;     /* on-board type-code label (INT/CLI/MS...) text size */
  --title-scale:1;     /* on-board short-title text size */
  --hrs-scale:1;       /* on-board milestone-hours text size */

     5 steps, matching the same "don't invent, formalise what's already there"
     principle as the spacing scale — the file already clusters around 9/10/11px
     for controls and 8/8.5px for fine print; this just names those sizes so
     future components pick a real token instead of a new one-off value. */
  --text-xs:9px;    /* fine print — meta info, captions */
  --text-sm:10px;   /* default control/label text */
  --text-base:11px; /* body default */
  --text-md:12px;   /* mild emphasis — section values, sub-headings */
  --text-lg:14px;   /* stronger emphasis, rarely needed outside the milestone card */

  /* ===== Corner radius =====
     Same principle again: the file already used 3px, 4px and 8px by hand, in
     roles that map cleanly onto controls / surfaces / pills. Naming those three
     is what lets a new component pick a radius instead of inventing a fourth. */
  --radius-sm:4px;     /* inputs, buttons, small chips */
  --radius-md:6px;     /* cards and other bordered surfaces */
  --radius-pill:999px; /* badges, tabs, anything fully rounded */

  /* ===== Row height, and the label band that has to fit inside it =====
     The label collision band was a fixed 15px. A label stack in ID + Title
     mode is 25px tall, so in a 34px row it has 4.5px of slack each side and a
     15px band necessarily puts it ~10.5px onto the neighbouring row. Measured
     at 31 of 150 stacks overflowing, worst 18.2px (TD-108). That is geometry,
     not tuning: keeping a 15px band needs a 55px row.
     So the band is derived from the row height instead of fixed, and cannot
     exceed the room actually available. 13px is half the stack, rounded up. */
  --row-min-h:34px;

  --ico-half:7.5px;

  /* ===== Control-sizing tokens (D-16) =====

     documented only, with zero consumers in this file. Aliased onto existing
     app tokens where the standard says to; "new" values below are the ones
     the standard introduces (D-16's own table calls out the mapping).

     pointer:coarse block right after this one. This does NOT touch the D-15
     icon-button minimum hit-target rule (28px desktop / 44px coarse,
     line ~1923): that is an already-shipped, test-covered convention for
     click/tap-target size, not control height, and the two coexist. */
  --ctl-h:24px;
  --ctl-h-touch:32px;

/* =====================================================================
   SRET grid view (D-09). Tier 3 component styles: every colour is a
   --color-* role, every size a D-16 token. No literal colours here.
   The vendored engine stylesheet (vendor/slickgrid/dist/slick.grid.css)
   carries structural rules plus a handful of its own greys; every rule of
   it that paints is overridden below under .sg-grid, and
   tools/grid_view_check.py proves it with a palette swap on the open grid.
   ===================================================================== */
.sg-screen{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;min-width:0;min-height:0;
  background:var(--color-bg-panel);color:var(--color-text-primary);font-family:var(--font-sans);
  font-size:var(--text-md);line-height:16px}
.sg-screen--fixed{position:fixed}
.sg-screen *,.sg-screen *::before,.sg-screen *::after{box-sizing:border-box}

/* ---- header: three rows, after the Aconex register (Matt, 2026-09-27) ----
   Row 1: back, title. Row 2: search, Add row (split), Tools, Add to temp list
   (split). Row 3: counts, Select all, the filter pill. Rows 2 and 3 start in
   line with the title text, leaving the strip above the rail clear up to the
   back arrow. Row 2 only wraps below 768px. */
.sg-screen{--sg-indent:calc(var(--group-gap) + var(--icon-btn) + var(--ctl-gap))}
.sg-bar,.sg-bar2,.sg-bar3{display:flex;flex-wrap:nowrap;align-items:center;gap:var(--ctl-gap);
  padding:var(--space-4) var(--group-gap);background:var(--color-bg-elevated)}
.sg-bar{padding-bottom:0}
.sg-bar2,.sg-bar3{padding-left:var(--sg-indent)}
.sg-bar2{padding-bottom:0}
.sg-bar3{padding-top:var(--space-3);padding-bottom:var(--space-3);border-bottom:1px solid var(--color-border-panel)}
.sg-bar-lead{display:flex;align-items:center;gap:var(--ctl-gap);min-width:0;flex:0 1 auto}
.sg-spacer{flex:1 1 auto;min-width:0}
.sg-title{margin:0;font-size:20px;line-height:28px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--color-text-primary)}
/* Title as a view switcher: the heading's own size and weight, a chevron, no button chrome until hover. */
.sg-title--views{overflow:visible}
.sg-note{color:var(--color-text-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-picker{max-width:320px}
.sg-picker > span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-title .sg-btn.sg-title-btn{height:auto;padding:0 var(--space-3);margin-left:calc(-1 * var(--space-3));font-size:inherit;line-height:inherit;font-weight:inherit;
  border-color:transparent;background:transparent;color:var(--color-text-primary)}
.sg-title .sg-btn.sg-title-btn:hover,.sg-title .sg-btn.sg-title-btn.is-open{background:var(--color-btn-secondary-hover-bg);border-color:var(--color-line-default)}
.sg-title .sg-menu-pop{font-size:var(--text-md);font-weight:400;line-height:normal}
.sg-counts{display:inline-flex;gap:var(--ctl-gap-tight);color:var(--color-text-muted);white-space:nowrap}
.sg-selcount:not(:empty){color:var(--color-text-primary);font-weight:600}
.sg-link{height:var(--ctl-h);padding:0 var(--space-2);border:0;background:transparent;font:inherit;font-size:var(--text-md);
  color:var(--color-accent-ink);cursor:pointer;white-space:nowrap;border-radius:var(--radius-ctl)}
.sg-link:hover:not(:disabled){text-decoration:underline}
.sg-link:disabled{color:var(--color-text-label);cursor:default}
.sg-pill{display:inline-flex;align-items:center;height:var(--ctl-h);padding:0 var(--ctl-pad-x);font:inherit;font-size:var(--text-md);
  white-space:nowrap;cursor:pointer;border:var(--stroke-ctl) solid var(--color-accent);border-radius:var(--radius-pill);
  background:var(--color-accent-tint-bg);color:var(--color-accent-ink)}
.sg-pill[hidden]{display:none}
.sg-msg{position:absolute;left:50%;bottom:var(--group-gap);transform:translateX(-50%);z-index:5;max-width:min(640px,calc(100% - 2 * var(--group-gap)));
  padding:var(--space-4) var(--space-5);border-radius:var(--radius-overlay);box-shadow:var(--shadow-2);pointer-events:none;
  background:var(--color-tooltip-bg);color:var(--color-text-on-header);font-size:var(--text-md);line-height:16px;
  opacity:0;transition:opacity .2s ease}
.sg-msg.is-shown{opacity:1}
.sg-badge{display:inline-block;min-width:16px;padding:0 var(--space-2);border-radius:var(--radius-pill);
  background:var(--color-accent);color:var(--color-text-on-accent);font-weight:600;font-size:var(--text-sm);line-height:16px;text-align:center}
.sg-badge[hidden]{display:none}

/* ---- dropdown menu ---- */
.sg-menu{position:relative;display:inline-flex}
.sg-btn--menu{display:inline-flex;align-items:center;gap:var(--space-2)}
.sg-btn--menu.is-open{background:var(--color-btn-secondary-pressed-bg)}
.sg-btn--primary.sg-btn--menu.is-open{background:var(--color-btn-primary-pressed-bg)}
.sg-chev{display:inline-flex}
.sg-menu-pop{position:absolute;top:calc(100% + var(--space-1));left:0;z-index:20;min-width:200px;width:max-content;max-width:420px;padding:var(--space-2) 0;
  background:var(--color-bg-elevated);color:var(--color-text-primary);border:1px solid var(--color-border-panel);
  border-radius:var(--radius-overlay);box-shadow:var(--shadow-2)}
.sg-menu-pop[hidden]{display:none}
.sg-temp-actions .sg-menu:last-child .sg-menu-pop{left:auto;right:0}
/* Split button: main action and its options arrow, joined. */
.sg-split{display:inline-flex}
.sg-split-main{border-top-right-radius:0;border-bottom-right-radius:0}
.sg-split-chev{display:inline-flex;align-items:center;justify-content:center;padding:0 var(--space-2);margin-left:-1px;
  border-top-left-radius:0;border-bottom-left-radius:0}
.sg-btn--primary.sg-split-chev{border-left-color:var(--color-btn-primary-hover-bg)}
.sg-split-chev.is-open{background:var(--color-btn-secondary-pressed-bg)}
.sg-btn--primary.sg-split-chev.is-open{background:var(--color-btn-primary-pressed-bg)}
.sg-split-main{display:inline-flex;align-items:center;gap:var(--space-3)}
/* My temp list mark: one vertical line, used on rows, the rail, the panel title and the button. */
.sg-tempmark{display:inline-block;flex:0 0 auto;width:3px;height:14px;border-radius:var(--radius-pill);background:var(--color-accent)}
.sg-btn:disabled .sg-tempmark{background:var(--color-text-label)}
.sg-tempmark--rail{height:18px;width:4px}
.sg-menu-item{display:flex;align-items:center;gap:var(--space-2);width:100%;min-height:calc(var(--ctl-h) + var(--space-2));
  padding:0 var(--space-5) 0 var(--space-3);border:0;background:transparent;font:inherit;font-size:var(--text-lg);text-align:left;
  color:var(--color-text-primary);cursor:pointer;white-space:nowrap}
.sg-menu-item:hover:not(:disabled),.sg-menu-item:focus-visible{background:var(--color-row-hover-bg);outline:0}
.sg-menu-item:disabled{color:var(--color-text-label);cursor:default}
.sg-menu-check{flex:0 0 14px;color:var(--color-accent-ink);font-weight:600}
.sg-menu-sep{height:1px;margin:var(--space-2) 0;background:var(--color-line-hairline)}

.sg-iconbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--icon-btn);height:var(--icon-btn);
  padding:0;border:0;border-radius:var(--radius-ctl);background:transparent;color:var(--color-text-primary);cursor:pointer}
.sg-iconbtn:hover{background:var(--color-btn-icon-hover-bg)}
.sg-iconbtn:active{background:var(--color-btn-icon-pressed-bg)}

.sg-search,.sg-hfilter{height:var(--ctl-h);padding:0 var(--ctl-pad-x);font:inherit;font-size:var(--text-md);
  border:var(--stroke-ctl) solid var(--color-input-border);border-radius:var(--radius-ctl);
  background:var(--color-bg-elevated);color:var(--color-text-primary)}
.sg-search{width:200px;min-width:120px}
.sg-select{height:var(--ctl-h);padding:0 var(--ctl-pad-x);font:inherit;font-size:var(--text-md);max-width:220px;cursor:pointer;
  border:var(--stroke-ctl) solid var(--color-input-border);border-radius:var(--radius-ctl);
  background:var(--color-bg-elevated);color:var(--color-text-primary)}
.sg-select:disabled{opacity:.5;cursor:default}
/* Options otherwise take the browser's grey when the select is disabled, which ignores the theme. */
.sg-select option{color:var(--color-text-primary);background-color:var(--color-bg-elevated)}
.sg-search::placeholder,.sg-hfilter::placeholder{color:var(--color-text-label)}

.sg-btn{height:var(--ctl-h);padding:0 var(--ctl-pad-x);font:inherit;font-size:var(--text-md);white-space:nowrap;cursor:pointer;
  border:var(--stroke-ctl) solid var(--color-btn-secondary-outline);border-radius:var(--radius-ctl);
  background:var(--color-btn-secondary-bg);color:var(--color-btn-secondary-text)}
.sg-btn:hover:not(:disabled){background:var(--color-btn-secondary-hover-bg)}
.sg-btn:active:not(:disabled){background:var(--color-btn-secondary-pressed-bg)}
.sg-btn--primary{font-weight:600;border-color:var(--color-btn-primary-outline);background:var(--color-btn-primary-bg);color:var(--color-btn-primary-text)}
.sg-btn--primary:hover:not(:disabled){background:var(--color-btn-primary-hover-bg)}
.sg-btn--primary:active:not(:disabled){background:var(--color-btn-primary-pressed-bg)}
.sg-btn--danger{font-weight:600;border-color:var(--color-status-crit);background:var(--color-status-crit);color:var(--color-text-on-accent)}
.sg-btn--danger:hover:not(:disabled){background:var(--color-crit-border)}
.sg-btn:disabled{opacity:.5;cursor:default}

.sg-screen :focus-visible{outline:var(--focus-ring) solid var(--color-accent);outline-offset:1px}

/* ---- inline confirmation (design-standard.md, Inline confirmation) ---- */
.sg-confirm{padding:var(--space-4) var(--group-gap);background:var(--color-crit-tint-bg);color:var(--color-crit-text);
  border-bottom:1px solid var(--color-border-panel)}
.sg-confirm[hidden]{display:none}
.sg-confirm-msg{margin:0 0 var(--ctl-gap);font-size:var(--text-lg);line-height:20px}
.sg-confirm-btns{display:flex;justify-content:space-between;gap:var(--ctl-gap)}

/* ---- body: rail, My temp list panel (vertical, docked left), grid ---- */
.sg-body{display:flex;flex:1 1 auto;min-height:0;min-width:0}
.sg-rail{flex:0 0 40px;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-4) 0;
  background:var(--color-bg-subtle);border-right:1px solid var(--color-border-panel)}
.sg-rail-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;
  border:0;border-radius:var(--radius-ctl);background:transparent;color:var(--color-text-primary);cursor:pointer}
.sg-rail-btn:hover{background:var(--color-btn-icon-hover-bg)}
.sg-rail-btn.is-open{background:var(--color-accent-tint-bg);color:var(--color-accent-ink);box-shadow:inset 3px 0 0 var(--color-accent)}
.sg-rail-badge{position:absolute;top:-2px;right:-4px}
.sg-temp{flex:0 0 300px;width:300px;display:flex;flex-direction:column;min-height:0;
  background:var(--color-bg-subtle);color:var(--color-text-primary);border-right:1px solid var(--color-border-panel)}
.sg-temp[hidden]{display:none}
.sg-temp-head{display:flex;align-items:center;gap:var(--ctl-gap);padding:var(--space-4) var(--space-5) 0}
.sg-temp-head [hidden]{display:none}
.sg-temp-title{display:inline-flex;align-items:center;gap:var(--ctl-gap);margin:0;font-size:var(--text-lg);line-height:20px;font-weight:600;white-space:nowrap}
.sg-list-head{flex:1 1 auto;min-width:0;display:flex}
.sg-list-pick{flex:1 1 auto;min-width:0;font-weight:600}
.sg-temp-actions{display:flex;align-items:center;gap:var(--ctl-gap);padding:var(--space-4) var(--space-5) var(--space-2)}
.sg-temp-actions[hidden]{display:none}
.sg-temp-sub{display:flex;align-items:center;flex-wrap:wrap;gap:var(--ctl-gap-tight) var(--ctl-gap);
  padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-line-default)}
.sg-temp-all{display:inline-flex;align-items:center;gap:var(--ctl-gap);cursor:pointer;color:var(--color-text-muted)}
.sg-temp-items{flex:1 1 auto;min-height:0;overflow:auto;list-style:none;margin:0;padding:0;background:var(--color-bg-elevated)}
.sg-temp-item{border-bottom:1px solid var(--color-line-hairline)}
.sg-temp-item.sg-in-temp .sg-temp-item-lbl{box-shadow:inset 3px 0 0 var(--color-accent)}
.sg-temp-item-lbl{display:flex;align-items:flex-start;gap:var(--ctl-gap);padding:var(--space-3) var(--space-5);cursor:pointer}
.sg-temp-item-lbl:hover{background:var(--color-row-hover-bg)}
.sg-temp-item-text{display:flex;flex-direction:column;min-width:0}
.sg-temp-item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-temp-item-lists{color:var(--color-text-muted);font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-temp-empty{padding:var(--space-5);color:var(--color-text-muted)}
.sg-temp input[type=checkbox]{flex:0 0 16px;width:16px;height:16px;margin:0;color:inherit;accent-color:var(--color-accent)}
.sg-temp-form,.sg-temp-confirm{padding:var(--space-3) var(--space-5) var(--space-4)}
.sg-temp-form[hidden],.sg-temp-confirm[hidden]{display:none}
.sg-temp-form-lbl{margin:0 0 var(--ctl-gap-tight);font-weight:600}
.sg-temp-name{width:100%;margin-bottom:var(--ctl-gap)}
.sg-temp-err{margin:0;padding:0 var(--space-5) var(--space-3);color:var(--color-crit-text)}
.sg-temp-err:empty{display:none}

/* ---- List column: collapsed indicator, or expanded names ---- */
.sg-grid .slick-header-column.sg-lcol-h{padding:0 var(--space-1)}
.sg-grid .slick-cell.sg-lcol{padding:0 var(--space-2)}
.sg-lcol-toggle{display:inline-flex;align-items:center;gap:var(--space-1);height:100%;padding:0 var(--space-1);border:0;
  background:transparent;font:inherit;font-weight:600;color:inherit;cursor:pointer;border-radius:var(--radius-ctl)}
.sg-lcol-toggle:hover{background:var(--color-btn-icon-hover-bg)}
.sg-lcol-arrow{color:var(--color-accent-ink)}
.sg-inlist{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--color-accent-ink);font-weight:600}
.sg-inlist-mark{display:inline-block;width:8px;height:8px;border-radius:var(--radius-pill);background:var(--color-accent)}
/* Rows on My temp list: a vertical line to the left of the checkbox. */
.sg-grid .slick-row.sg-in-temp .slick-cell.sg-check{box-shadow:inset 3px 0 0 var(--color-accent)}

/* ---- status shading (conditional formatting on a column's value) ---- */
.sg-grid .slick-cell.sg-tone{font-weight:600}
.sg-grid .slick-cell.sg-tone-future{background:var(--color-status-track-bg);color:var(--color-text-muted)}
.sg-grid .slick-cell.sg-tone-track{background:color-mix(in srgb,var(--color-status-track) 16%,var(--color-bg-canvas));color:var(--color-text-primary)}
.sg-grid .slick-cell.sg-tone-risk{background:var(--color-notice-bg);color:var(--color-notice-ink)}
.sg-grid .slick-cell.sg-tone-crit{background:var(--color-crit-tint-bg);color:var(--color-crit-text)}
.sg-grid .slick-cell.sg-tone-done{background:var(--color-ready-tint-bg);color:var(--color-ok-text)}

/* ---- health icon (same states and roles as the dashboard's health dot) ---- */
.sg-hdot{display:inline-block;color:var(--color-text-primary);flex:0 0 auto;width:10px;height:10px;margin:0 var(--space-3) 0 0;padding:0;vertical-align:middle;
  border-radius:var(--radius-pill);border:1.2px solid var(--color-health-rim);background:transparent;cursor:pointer}
button.sg-hdot:hover{transform:scale(1.25)}
.sg-hdot.sg-h-0{background:transparent;border-color:var(--color-health-none-border)}
.sg-hdot.sg-h-1{background:var(--color-health-good);border-color:var(--color-health-good-border)}
.sg-hdot.sg-h-2{background:var(--color-health-watch);border-color:var(--color-health-watch-border)}
.sg-hdot.sg-h-3{background:var(--color-crit);border-color:var(--color-crit-border)}
.sg-hdot.sg-h-4{background:var(--color-status-done);border-color:var(--color-health-good-border)}
.sg-hpick{position:absolute;min-width:160px}
.sg-sym{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:16px;height:16px;margin:0 var(--space-3) 0 0;
  padding:0;border:0;background:transparent;vertical-align:middle;cursor:pointer;color:var(--color-text-primary)}
.sg-sym .sg-sym-svg{width:13px;height:13px;display:block}
button.sg-sym:hover{transform:scale(1.2)}
.sg-sym--menu{margin-right:var(--space-2);cursor:default}
.sg-hpick .sg-hdot{margin-right:var(--space-2);cursor:default}
.sg-grid .slick-cell.sg-cell-open{cursor:pointer}

/* ---- import and Import log ---- */
.sg-import-pick p{margin:0 0 var(--ctl-gap);color:var(--color-text-muted)}
.sg-import-pick[hidden]{display:none}
.sg-import-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--ctl-gap);margin-bottom:var(--ctl-gap)}
.sg-import-date{display:inline-flex;align-items:center;gap:var(--ctl-gap);color:var(--color-text-label)}
.sg-select.sg-date-order{max-width:none}
.sg-import-status:not(:empty){margin-top:var(--group-gap);padding-top:var(--group-gap);border-top:1px solid var(--color-line-default)}
.sg-import-status:first-child{margin-top:0;padding-top:0;border-top:0}
.sg-import-status[data-kind=error]{color:var(--color-crit-text)}
.sg-import-head{margin:0 0 var(--ctl-gap);font-weight:600;font-size:var(--text-lg)}
/* Host-page p rules must not recolour the import text. */
.sg-dialog .sg-import-status p{margin:0 0 var(--ctl-gap);color:inherit}
.sg-dialog .sg-import-status p.sg-muted{color:var(--color-text-muted)}
.sg-import-summary{margin:0 0 var(--group-gap);padding-left:var(--group-gap)}
.sg-muted{color:var(--color-text-muted)}
.sg-itable-wrap{max-height:260px;overflow:auto;margin-bottom:var(--ctl-gap);border:1px solid var(--color-line-default);border-radius:var(--radius-ctl)}
.sg-itable{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--text-md);line-height:16px}
.sg-itable th{position:sticky;top:0;text-align:left;font-weight:600;background:var(--color-bg-subtle);color:var(--color-text-primary)}
.sg-itable th,.sg-itable td{padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--color-line-hairline);vertical-align:top}
.sg-itable td{color:var(--color-text-primary)}

/* ---- dialog: centre screen, modal (Import milestones) ---- */
.sg-scrim{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:var(--group-gap);
  background:var(--color-scrim)}
.sg-dialog{width:min(640px,100%);max-height:calc(100% - 2 * var(--group-gap));display:flex;flex-direction:column;
  background:var(--color-dialog-elev);color:var(--color-text-primary);border:1px solid var(--color-border-panel);
  border-radius:var(--radius-overlay);box-shadow:var(--shadow-3)}
.sg-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:var(--ctl-gap);
  padding:var(--space-5) var(--group-gap) var(--space-4);border-bottom:1px solid var(--color-line-default)}
.sg-dialog--wide{width:min(1040px,100%)}
.sg-dialog-title{margin:0;font-size:20px;line-height:28px;font-weight:600}
.sg-dialog-body{padding:var(--group-gap);overflow:auto;font-size:var(--text-lg);line-height:20px}
@media (max-width:767px){
  .sg-temp{position:absolute;top:0;bottom:0;left:40px;z-index:10;width:min(300px,calc(100% - 40px));box-shadow:var(--shadow-3)}
  .sg-body{position:relative}
}

/* ---- grid engine skin ---- */
.sg-grid{flex:1 1 auto;min-height:0;min-width:0;position:relative;background:var(--color-bg-canvas);color:var(--color-text-primary)}
.sg-grid .slick-pane,.sg-grid .slick-viewport{background:var(--color-bg-canvas)}
/* Scroll inside the grid never chains to the page, and row layout stays inside each row. */
.sg-grid .slick-viewport{overscroll-behavior:contain}
.sg-grid .slick-row{contain:layout style}
.sg-grid .slick-header.ui-state-default,.sg-grid .slick-headerrow.ui-state-default{
  background:var(--color-bg-subtle);border-top:0;border-bottom:1px solid var(--color-line-default)}
.sg-grid .slick-header-column.ui-state-default{height:var(--sg-head-h);line-height:var(--sg-head-h);
  padding:0 var(--space-4);box-sizing:border-box!important;font-weight:600;
  background:var(--color-bg-subtle);color:var(--color-text-primary);border-right:1px solid var(--color-line-hairline);cursor:pointer}
.sg-grid .slick-header-column.ui-state-default:hover{background:var(--color-row-hover-bg)}
.sg-grid .slick-header-column.sg-h-edit .slick-column-name{text-decoration:underline dotted var(--color-accent);text-underline-offset:3px}
.sg-grid .slick-header-column-sorted{font-style:normal;color:var(--color-accent-ink)}
.sg-grid .slick-sort-indicator{margin-top:0;float:right;height:100%;display:inline-flex;align-items:center}
.sg-grid .slick-sort-indicator-asc,.sg-grid .slick-sort-indicator-desc{color:var(--color-accent-ink);margin-top:0;align-self:center}
.sg-grid .slick-resizable-handle:hover{background:var(--color-accent-wash-strong)}
.sg-grid .slick-headerrow-column.ui-state-default{padding:var(--space-2);background:var(--color-bg-subtle);
  border-right:1px solid var(--color-line-hairline);border-bottom-color:var(--color-line-default)}
.sg-grid .sg-hfilter{width:100%;min-width:0}

.sg-grid .slick-row{background:var(--color-row-default-bg)}
.sg-grid .slick-row.odd{background:var(--color-row-alt-bg)}
.sg-grid .slick-row:hover{background:var(--color-row-hover-bg)}
.sg-grid .slick-cell{padding:0 var(--space-4);line-height:calc(var(--ctl-h) - 2px);color:var(--color-text-primary);
  border-top-color:transparent;border-left-color:transparent;
  border-right:1px solid var(--color-line-hairline);border-bottom-color:var(--color-line-hairline)}
.sg-grid .slick-cell.selected{background:var(--color-row-selected)}
.sg-grid .slick-cell.active{box-shadow:inset 0 0 0 var(--focus-ring) var(--color-accent)}
.sg-grid .slick-cell.editable{padding:0;background:var(--color-bg-elevated);border-color:var(--color-accent);border-style:solid}
.sg-grid .slick-cell.invalid{box-shadow:inset 0 0 0 var(--focus-ring) var(--color-status-crit)}
.sg-grid .slick-cell.highlighted{background:var(--color-accent-wash)}
.sg-grid .slick-cell.flashing{border-color:var(--color-status-crit)!important}
.sg-grid .slick-selection{border-color:var(--color-accent)}
.sg-grid .sg-check,.sg-grid .slick-header-column.sg-check-h{display:flex;align-items:center;justify-content:center;padding:0;text-overflow:clip}
.sg-grid .slick-header-column .slick-column-name input[type=checkbox],.sg-grid .sg-check input[type=checkbox]{
  width:16px;height:16px;margin:0;vertical-align:middle;color:inherit;accent-color:var(--color-accent)}

.sg-editor{width:100%;height:100%;margin:0;padding:0 var(--space-4);font:inherit;border:0;outline:0;
  background:var(--color-bg-elevated);color:var(--color-text-primary)}

/* Header buttons wrap whenever they run out of room, not only on phones. */
.sg-bar2{flex-wrap:wrap;row-gap:var(--ctl-gap)}
/* Phones: search behind a button in the title row; the counts row only while
   something is selected or filtered (the header checkbox still selects all). */
.sg-search-toggle{display:none}
@media (max-width:767px){
  .sg-bar,.sg-bar2,.sg-bar3{padding-left:var(--space-4);padding-right:var(--space-4)}
  .sg-bar{justify-content:space-between}
  .sg-search-toggle{display:inline-flex;flex:0 0 auto}
  .sg-screen:not(.is-search-open):not(.has-search) .sg-search{display:none}
  .sg-screen.is-search-open .sg-search-toggle,.sg-screen.has-search .sg-search-toggle{color:var(--color-accent-ink)}
  .sg-bar3.is-idle{display:none}
  .sg-bar2 .sg-spacer{display:none}
  .sg-search{flex:1 1 100%;width:auto}
}

/* ---- predecessor and successor picker (tokens + type-ahead) ---- */
.sg-refs-pop{position:absolute;z-index:40;max-width:min(420px,calc(100% - 8px));padding:var(--space-2);
  background:var(--color-bg-elevated);border:1px solid var(--color-accent);border-radius:var(--radius-ctl);box-shadow:var(--shadow-2)}
.sg-refs{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)}
.sg-refs-toks{display:contents}
.sg-tok{display:inline-flex;align-items:center;gap:var(--space-1);height:calc(var(--ctl-h) - 4px);padding:0 0 0 var(--space-3);
  border:1px solid var(--color-line-default);border-radius:var(--radius-pill);background:var(--color-bg-subtle);
  color:var(--color-text-primary);font-size:var(--text-md);white-space:nowrap}
.sg-tok--unknown{border-style:dashed;color:var(--color-crit-text)}
.sg-tok-x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:var(--space-1);padding:0;
  border:0;border-radius:var(--radius-pill);background:transparent;color:var(--color-text-muted);font:inherit;cursor:pointer}
.sg-tok-x:hover{background:var(--color-btn-icon-hover-bg);color:var(--color-text-primary)}
.sg-refs-input{flex:1 1 120px;min-width:100px;height:calc(var(--ctl-h) - 4px);border:0;outline:0;padding:0 var(--space-2);font:inherit;
  background:transparent;color:var(--color-text-primary)}
.sg-refs-list{position:absolute;left:0;right:0;top:100%;margin-top:var(--space-2);max-height:240px;overflow:auto;z-index:41;
  background:var(--color-bg-elevated);border:1px solid var(--color-border-panel);border-radius:var(--radius-ctl);box-shadow:var(--shadow-2)}
.sg-refs-list[hidden],.sg-refs-more[hidden]{display:none}
.sg-refs-opt{display:flex;gap:var(--space-4);align-items:baseline;padding:var(--space-2) var(--space-4);cursor:pointer;color:var(--color-text-primary)}
.sg-refs-opt b{flex:0 0 auto;font-weight:600}
.sg-refs-opt span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text-muted)}
.sg-refs-opt.is-hi,.sg-refs-opt:hover{background:var(--color-row-hover-bg)}
.sg-refs-more{flex:1 1 100%;color:var(--color-text-muted);font-size:var(--text-sm)}
.sg-refs-cell{padding:0 var(--space-4);color:var(--color-text-muted)}

/* ---- bulk edit ---- */
.sg-btn[hidden]{display:none}
.sg-bulk{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:var(--ctl-gap) var(--group-gap);align-items:center;margin:var(--ctl-gap) 0 var(--group-gap)}
.sg-bulk-lbl{display:flex;align-items:center;gap:var(--ctl-gap);color:var(--color-text-label);cursor:pointer}
.sg-bulk-lbl input{width:16px;height:16px;margin:0;accent-color:var(--color-accent)}
.sg-bulk-ctl{min-width:0}
.sg-bulk-ctl .sg-select,.sg-bulk-input{width:100%;max-width:none}
.sg-bulk-refs{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-2);border:1px solid var(--color-line-default);border-radius:var(--radius-ctl)}
.sg-dialog .sg-import-status p.sg-bulk-err,.sg-dialog p.sg-bulk-err{color:var(--color-crit-text)}
.sg-bulk-err[hidden]{display:none}
@media (max-width:767px){ .sg-bulk{grid-template-columns:minmax(0,1fr)} .sg-bulk-ctl{margin-bottom:var(--ctl-gap)} }

/* ---- touch (D-16 rule, as the dashboard): controls take --ctl-h-touch through
   --ctl-h; each tap area reaches --ctl-hit-touch through an invisible
   pseudo-element, never by growing the visible control. Rows grow to the
   tap size so the controls inside a cell (checkbox, health dot, icon) get
   the whole cell. ---- */
.sg-screen{--sg-row-h:var(--ctl-h);--sg-head-h:calc(var(--ctl-h) + var(--space-2))}
@media (pointer:coarse){
  .sg-screen{--sg-row-h:var(--ctl-hit-touch);--sg-head-h:var(--ctl-hit-touch)}
  .sg-btn,.sg-iconbtn,.sg-link,.sg-rail-btn,.sg-lcol-toggle,.sg-tok-x,.sg-sym,button.sg-hdot,.sg-search-toggle{position:relative}
  .sg-btn::after,.sg-iconbtn::after,.sg-link::after,.sg-rail-btn::after,.sg-lcol-toggle::after,.sg-tok-x::after,.sg-sym::after,button.sg-hdot::after,.sg-search-toggle::after{
    content:'';position:absolute;top:50%;left:50%;width:max(100%,var(--ctl-hit-touch));height:max(100%,var(--ctl-hit-touch));transform:translate(-50%,-50%)}
  .sg-menu-item,.sg-refs-opt{min-height:var(--ctl-hit-touch)}
  .sg-refs-opt{align-items:center}
}

/* Pinned columns: the pinned pane scrolls up and down natively (following the
   main pane) with its scrollbar hidden, and never sideways. */
.sg-grid .slick-pane-left .slick-viewport{overflow-y:auto!important;overflow-x:hidden!important;scrollbar-width:none}
.sg-grid .slick-pane-left .slick-viewport::-webkit-scrollbar{display:none}
.sg-grid .slick-pane-left{box-shadow:1px 0 0 var(--color-line-default)}

/* SRET user name field (Data settings) and save history. Roles and D-16 tokens only. */
.su-field{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--ctl-gap)}
.su-label{display:flex;flex-direction:column;gap:var(--space-2);color:var(--color-text-label);font-size:var(--text-sm)}
.su-name{width:260px;max-width:100%}
.su-box p.su-note{margin:var(--ctl-gap) 0 0;color:var(--color-text-primary)}
.su-box p.su-note[data-state=unset]{color:var(--color-crit-text)}
.su-box p.su-error{margin:var(--ctl-gap) 0 0;color:var(--color-crit-text)}
.su-error[hidden]{display:none}
.su-box p.su-help{margin:var(--space-2) 0 0;color:var(--color-text-muted);font-size:var(--text-sm)}
.su-h{margin:var(--group-gap) 0 var(--ctl-gap);font-size:var(--text-lg);font-weight:600}
.su-prefix{width:160px;max-width:100%;text-transform:uppercase}
.su-box p.su-error[data-kind=warning]{color:var(--color-text-primary)}

/* Copied from src/milestone-dashboard.html: the marker colours. */
.ms-icon{display:block;position:relative;z-index:2;flex-shrink:0}
.ms-icon.s-done{color:var(--color-icon-done)}
.ms-icon.s-doneuser{color:var(--color-icon-doneuser)}
.ms-icon.s-track{color:var(--color-icon-track)}
.ms-icon.s-risk{color:var(--color-icon-risk)}
.ms-icon.s-crit{color:var(--color-icon-crit)}
.ms-icon.s-future{color:var(--color-icon-future)}
.ms-icon.s-baseline{color:var(--color-icon-baseline)}
.ms-icon.s-na{color:var(--color-icon-na)}
.ms-icon.filled{fill:currentColor;stroke:currentColor;stroke-width:.75;stroke-linejoin:round}
.ms-icon.outline{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ms-icon.baseline{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-dasharray:2.5 1.8}

<script id="app-script">
/* =====================================================================
   SRET grid view (D-09). One full-screen table view, three uses:
   annotation collections, user-defined milestones, schedule activities.

   Contract (docs/grid-view-integration.md):
     SRETGrid.open({
       title, columns:[{key,label,type,editable,options,width}], rows, rowKey,
       editable, onEdit(rowKey,key,value), onAdd(), onDelete(rowKeys),
       onBack(), exportName, ensureXLSX, host, canEdit(rowKey,key),
       lists:{ store, refOf(rowKey), labelOf(ref), onChange(result) },
       openColumn, onOpenItem(rowKey), importer:{...},
       views:[{id,label,count}], view, onView(id)   (title becomes a view switcher)
       pickers:[{sg,label,items:[{id,label,checked}],onSelect(id)}], note,
       pin:['id','name']   columns kept in view on narrow screens (with the checkbox)
       toolsItems:[{label,sg,onSelect}]   importer.noun:['task','tasks']
     })
     SRETGrid.close()   SRETGrid.setRows(rows)   SRETGrid.patchRows(rows)   SRETGrid.isOpen()
     SRETGrid.dialog(title, build)   SRETGrid.importAoa(aoa, fileName)
   Column extras: min/max (numbers), hidden (kept for export and the
   import template, not shown), tones {value: tone} (shaded cell),
   icon {key,label,options} (a tap-to-edit dot before the value).
   Return false from onEdit to refuse a value (the cell reverts), from
   onDelete to keep the rows. onAdd returns the new row object (with its
   rowKey) or nothing to add no row. canEdit, optional, refuses an edit on
   one row where the column is otherwise editable.
   lists, optional, adds My temp list: "Add to temp list" for the selected
   rows, a "Temp list only" filter, and an expandable panel listing the temp
   items, where selected items are added to a saved list (existing or new),
   removed from the temp list, or the temp list is cleared. It also adds
   a read-only List column (left of the checkbox) and a mark on temp rows. store is the caller's SRETCollections
   store (data in); refOf maps a rowKey to the store's item ref; labelOf(ref),
   optional, names an item in the panel; onChange(result) runs after every
   change so the caller can persist. All rules live in the shared
   SRETCollections module (src/modules/collections/), never here.

   Data in, callbacks out. This module never reads or writes an app global.
   Rows are copied on open, so an edit reaches the caller only through
   onEdit; the caller's own objects are never mutated here. The only globals
   it touches are the grid library (Slick) and, for export, the SheetJS
   library object that ensureXLSX() resolves with (or window.XLSX if the
   loader resolves with nothing, which is what the app's ensureXLSX does).

   Engine: SlickGrid 5 (MIT), vendored under vendor/slickgrid/. The engine
   supplies virtual rendering, keyboard navigation, the edit lock (Enter to
   edit and commit, Esc to cancel), column resize and checkbox selection.
   This file supplies the screen, the editors, header filters, quick
   search, export and the callbacks.
   ===================================================================== */
(function(root){
  'use strict';

  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var TYPES={text:1,date:1,number:1,select:1,refs:1};
  var DEFAULT_WIDTH={text:180,date:96,number:80,select:120,refs:160};
  var CHECK_ID='_checkbox_selector';
  var S=null;   // the one open screen, or null

  // ---------- value helpers ----------
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function isoOk(v){ return typeof v==='string' && /^\d{4}-\d{2}-\d{2}/.test(v); }
  // 2026-08-29 -> 29-Aug-26, the app's board date format.
  function fmtDate(v){
    if(!isoOk(v)) return v==null?'':String(v);
    var y=v.slice(0,4), m=+v.slice(5,7), d=+v.slice(8,10);
    return d+'-'+MONTHS[m-1]+'-'+y.slice(2);
  }
  // Accepts ISO or d-Mmm-yy(yy); returns ISO or null. Used by filter operators.
  function parseDate(s){
    s=String(s).trim();
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var m=/^(\d{1,2})[-\s]([A-Za-z]{3})[-\s](\d{2}|\d{4})$/.exec(s);
    if(!m) return null;
    var mi=MONTHS.map(function(x){return x.toLowerCase();}).indexOf(m[2].toLowerCase());
    if(mi<0) return null;
    var y=m[3].length===2?'20'+m[3]:m[3];
    return y+'-'+String(mi+1).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');
  }
  function normOptions(opts){
    return (opts||[]).map(function(o){
      return (o && typeof o==='object')?{value:o.value,label:o.label==null?String(o.value):String(o.label)}
                                       :{value:o,label:String(o)};
    });
  }

    return String(v);
  }
  function display(col,v){

    return s.cols.filter(function(c){ return c.editable&&c.key.charAt(0)!=='_'&&c.key!==s.rowKey; })
      .concat(s.cols.filter(function(c){ return c.icon; }).map(function(c){ return s.colByKey[c.icon.key]; }).filter(function(c){ return c&&!c.editable; }));
  }
  function bulkControl(c,keys){
    var el;
    if(c.type==='refs'){
      var f=tokenField({label:c.label,value:'',options:refOptions(c.key,null)});
      var mode=h('select',{'class':'sg-select','data-sg':'bulk-mode-'+c.key,'aria-label':c.label+': how'},
        [['add','Add these IDs'],['replace','Replace with these IDs'],['remove','Remove these IDs']].map(function(o){ return h('option',{value:o[0],text:o[1]}); }));
      el=h('div',{'class':'sg-bulk-refs'},[mode,f.el]);
      return {el:el,focusEl:f.input,value:function(){ return {mode:mode.value,ids:f.tokens()}; },watch:[f.input,mode]};
    }
    if(c.type==='select'){
      el=h('select',{'class':'sg-select','aria-label':c.label},[h('option',{value:'',text:'(blank)'})].concat(c.opts.map(function(o){ return h('option',{value:String(o.value),text:o.label}); })));
      return {el:el,focusEl:el,value:function(){ var v=el.value; for(var i=0;i<c.opts.length;i++) if(String(c.opts[i].value)===v) return c.opts[i].value; return v===''?null:v; },watch:[el]};
    }
    el=h('input',{type:c.type==='date'?'date':'text','class':'sg-search sg-bulk-input','aria-label':c.label,inputmode:c.type==='number'?'decimal':null});
    return {el:el,focusEl:el,value:function(){ var v=el.value.trim(); if(c.type==='number') return v===''?null:Number(v); if(c.type==='date') return v||null; return el.value; },watch:[el]};
  }
  function openBulkEdit(){
    var s=S, keys=selectedKeys(); if(!keys.length) return;
    var n=keys.length, cols=bulkCols();
    openDialog(n>1?'Edit '+n+' rows':'Edit row',function(body,close){
      var rows=[], err=h('p',{'class':'sg-bulk-err','data-sg':'bulk-error',role:'alert',hidden:true});
      body.appendChild(h('p',{'class':'sg-muted',text:'Tick the fields to change. Each ticked field is set on all '+n+(n===1?' row':' rows')+'; the others are left as they are.'}));
      var grid=h('div',{'class':'sg-bulk','data-sg':'bulk-fields'});
      cols.forEach(function(c){
        var ctl=bulkControl(c,keys), tick=h('input',{type:'checkbox','data-sg':'bulk-tick-'+c.key,'aria-label':'Change '+c.label});
        ctl.watch.forEach(function(w){ w.addEventListener('input',function(){ tick.checked=true; }); w.addEventListener('change',function(){ tick.checked=true; }); });
        grid.appendChild(h('label',{'class':'sg-bulk-lbl'},[tick,h('span',{text:c.label})]));
        grid.appendChild(h('div',{'class':'sg-bulk-ctl','data-sg':'bulk-ctl-'+c.key},[ctl.el]));
        rows.push({c:c,tick:tick,ctl:ctl});
      });
      body.appendChild(grid); body.appendChild(err);
      var cancel=h('button',{type:'button','class':'sg-btn',text:'Cancel',on:{click:function(){ close(); }}});
      var apply=h('button',{type:'button','class':'sg-btn sg-btn--primary','data-sg':'bulk-apply',text:'Apply to '+n+(n===1?' row':' rows')});
      body.appendChild(h('div',{'class':'sg-confirm-btns'},[cancel,apply]));
      apply.addEventListener('click',function(){
        var todo=rows.filter(function(r){ return r.tick.checked; });
        if(!todo.length){ err.hidden=false; err.textContent='Tick at least one field to change.'; return; }
        for(var i=0;i<todo.length;i++){
          var c=todo[i].c, v=todo[i].ctl.value();
          if(c.type==='number'&&v!=null&&!isFinite(v)){ err.hidden=false; err.textContent=c.label+': enter a number.'; todo[i].ctl.focusEl.focus(); return; }
          if(c.type==='number'&&v!=null&&(c.min!=null&&v<c.min||c.max!=null&&v>c.max)){ err.hidden=false; err.textContent=c.label+': use '+c.min+' to '+c.max+'.'; todo[i].ctl.focusEl.focus(); return; }
        }
        var res=applyBulk(keys,todo.map(function(r){ return {c:r.c,v:r.ctl.value()}; }));
        body.innerHTML='';
        var ul=h('ul',{'class':'sg-import-summary','data-sg':'bulk-summary'});
        res.lines.forEach(function(l){ ul.appendChild(h('li',{text:l})); });
        var done=h('button',{type:'button','class':'sg-btn sg-btn--primary','data-sg':'bulk-done',text:'Done',on:{click:function(){ close(); }}});
        body.appendChild(h('div',{'class':'sg-import-status'},[h('p',{'class':'sg-import-head',text:'Changes applied'}),ul,h('div',{'class':'sg-confirm-btns'},[h('span'),done])]));
        say(res.lines[0]); done.focus();
      });
      (rows[0]&&rows[0].ctl.focusEl||apply).focus();
    });
  }
  function refsCombine(cur,mode,ids){
    var toks=refSplit(cur), up=function(x){ return refId(x); };
    if(mode==='replace') return ids.join(', ');
    if(mode==='remove'){ var rm={}; ids.forEach(function(x){ rm[up(x)]=1; }); return toks.filter(function(x){ return !rm[up(x)]; }).join(', '); }
    var have={}; toks.forEach(function(x){ have[up(x)]=1; });
    ids.forEach(function(x){ if(!have[up(x)]){ toks.push(x); have[up(x)]=1; } });
    return toks.join(', ');
  }
  function applyBulk(keys,sets){
    var s=S, changed=0, rowsChanged={}, refused=[], can=s.opts.canEdit;
    s.dv.beginUpdate();
    keys.forEach(function(k){
      var it=s.dv.getItemById(k); if(!it) return;
      var c2=Object.assign({},it), any=false;
      sets.forEach(function(st){
        var key=st.c.key, v=st.c.type==='refs'?refsCombine(it[key],st.v.mode,st.v.ids):st.v;
        if(String(v==null?'':v)===String(it[key]==null?'':it[key])) return;
        if(typeof can==='function'&&can(k,key)===false){ refused.push(k+' '+st.c.label); return; }
        var ret=typeof s.opts.onEdit==='function'?s.opts.onEdit(k,key,v):undefined;
        if(ret===false){ refused.push(k+' '+st.c.label); return; }
        c2[key]=v; any=true; changed++;
      });
      if(any){ if(s.lists) listFields(c2); s.dv.updateItem(k,c2); rowsChanged[k]=1; }
    });
    s.dv.endUpdate();
    s.grid.invalidate(); updateStatus();
    var nr=Object.keys(rowsChanged).length;
    var lines=[changed?'Updated '+nr+(nr===1?' row':' rows')+' ('+changed+(changed===1?' change':' changes')+').':'Nothing to change: the rows already had those values.'];
    lines.push('Fields: '+sets.map(function(st){ return st.c.label; }).join(', ')+'.');
    if(refused.length) lines.push((refused.length===1?'1 change was':refused.length+' changes were')+' not accepted: '+refused.slice(0,10).join('; ')+(refused.length>10?'; and '+(refused.length-10)+' more':'')+'.');
    return {lines:lines,changed:changed,refused:refused};
  }
  function selectedKeys(){
    var s=S;
    return s.grid.getSelectedRows().map(function(r){ var it=s.dv.getItem(r); return it&&it[s.rowKey]; })
            .filter(function(k){ return k!=null; });
  }
  function hideConfirm(){
    var s=S; if(!s) return;
    s.confirmEl.hidden=true; s.confirmEl.innerHTML='';
  }
  function showConfirm(){
    var s=S, keys=selectedKeys(); if(!keys.length) return;
    var n=keys.length;
    s.confirmEl.innerHTML='';
    var cancel=h('button',{type:'button','class':'sg-btn',text:'Cancel',on:{click:function(){ hideConfirm(); if(s.tools) s.tools.btn.focus(); }}});
    var go=h('button',{type:'button','class':'sg-btn sg-btn--danger','data-sg':'confirm-remove',text:'Remove',
      on:{click:function(){ doDelete(keys); }}});
    s.confirmEl.appendChild(h('p',{'class':'sg-confirm-msg',
      text:'Remove '+n+(n===1?' row':' rows')+'? This cannot be undone.'}));
    s.confirmEl.appendChild(h('div',{'class':'sg-confirm-btns'},[cancel,go]));
    s.confirmEl.hidden=false;
    cancel.focus();
  }
  function doDelete(keys){
    var s=S;
    var ok=s.opts.onDelete(keys.slice());
    hideConfirm();
    if(ok===false) return;
    s.grid.setSelectedRows([]);
    s.dv.beginUpdate();
    keys.forEach(function(k){ if(s.dv.getItemById(k)) s.dv.deleteItem(k); });
    s.dv.endUpdate();
    s.grid.invalidate();
    updateStatus();
    s.grid.focus();
  }
  function doAdd(){
    var s=S;
    var row=s.opts.onAdd();
    if(!row || row[s.rowKey]==null) return;
    var copy=Object.assign({},row);
    s.dv.addItem(copy);
    var idx=s.dv.getIdxById(copy[s.rowKey]);
    if(idx==null){ // hidden by a filter: clear filters so the new row is visible
      clearFilters();
      idx=s.dv.getIdxById(copy[s.rowKey]);
    }
    updateStatus();
    if(idx!=null){
      s.grid.scrollRowIntoView(idx);
      var first=firstEditableCell();
      if(first>=0){ s.grid.setActiveCell(idx,first); s.grid.editActiveCell(); }
    }
  }
  function firstDataCell(){
    var cols=S.grid.getColumns();
    for(var i=0;i<cols.length;i++) if(cols[i].sg && cols[i].id!==L_LIST) return i;
    return 0;
  }
  function firstEditableCell(){
    var cols=S.grid.getColumns();
    for(var i=0;i<cols.length;i++) if(cols[i].sg && cols[i].sg.editable && S.opts.editable) return i;
    return -1;
  }
  function clearFilters(){
    var s=S;
    s.quick=''; s.searchEl.value='';
    for(var k in s.filters) s.filters[k]='';
    s.screen.querySelectorAll('.sg-hfilter').forEach(function(i){ i.value=''; });
    s.dv.refresh();
  }

  // ---------- lists: My temp list and saved lists ----------
  // The rules live in SRETCollections. This section draws the controls and
  // calls it. Workflow (Matt, 2026-09-27):
  //   1. select rows, Add to temp list
  //   2. open My temp list, select items in it, Add to list
  //   3. Remove selected items from the temp list
  //   4. Clear the temp list (More menu)
  // Layout: one vertical panel docked left, opened from the rail in one of
  // two modes: My temp list, or Saved lists (a dropdown picks the list).
  // Action buttons sit under the title, above the items.
  var L_TMP='_tmp', L_LIST='_list', L_IDS='_lids';
  function M(){ return root.SRETCollections; }
  function listFields(item){
    var s=S, ref=s.lists.refOf(item[s.rowKey]);
    item[L_TMP]=M().inTemp(s.lists.store,ref)?'Yes':'';
    item[L_LIST]=M().membership(s.lists.store,ref).join(', ');
    item[L_IDS]=M().listIdsOf(s.lists.store,ref);
  }
  // Items are the grid's own copies, so the derived fields are written
  // straight onto them; the caller's rows are untouched.
  function refreshLists(){
    var s=S; if(!s||!s.lists) return;
    s.dv.getItems().forEach(listFields);
    s.dv.refresh(); s.grid.invalidate();
    updateStatus();
  }
  function patchRows(rows){
    var s=S; if(!s) return;
    s.dv.beginUpdate();
    (rows||[]).forEach(function(r){
      var k=r&&r[s.rowKey], cur=k!=null&&s.dv.getItemById(k);
      if(cur){ var it=Object.assign({},cur,r); if(s.lists) listFields(it); s.dv.updateItem(k,it); }
    });
    s.dv.endUpdate();
  }
  function selectedRefs(){ var s=S; return selectedKeys().map(function(k){ return s.lists.refOf(k); }); }
  function labelOf(ref){
    var s=S;
    if(typeof s.lists.labelOf==='function'){ var l=s.lists.labelOf(ref); if(l) return String(l); }
    return String(ref).replace(/^[^:]*:/,'');
  }
  function listName(id){
    var c=M().list(S.lists.store).filter(function(x){ return x.id===id; })[0]; return c?c.label:'';
  }
  function listsDone(r){
    var s=S;
    say(M().describe(r));
    if(s.pnlErr) s.pnlErr.textContent=r.error?M().describe(r):'';
    if(!r.error && typeof s.lists.onChange==='function') s.lists.onChange(r);
    if(s.scope&&s.scope.type==='list'&&!listName(s.scope.id)) s.scope=null;
    refreshLists();
    return r;
  }

  // ----- scope filter: only rows on My temp list, or on one saved list -----
  function inScope(item){
    var sc=S.scope;
    if(sc.type==='temp') return item[L_TMP]==='Yes';
    return (item[L_IDS]||[]).indexOf(sc.id)>=0;
  }
  function setScope(sc){ var s=S; s.scope=sc||null; s.dv.refresh(); updateStatus(); }
  function scopeIs(type,id){ var sc=S.scope; return !!sc&&sc.type===type&&(type==='temp'||sc.id===id); }

  // ----- the panel -----
  function panelItems(){
    var s=S, st=s.lists.store;
    return s.panelMode==='temp'?M().temp(st):M().itemsOf(st,s.listId);
  }
  function pickedRefs(){ var s=S; return panelItems().filter(function(r){ return s.picked[r]; }); }
  // Button states only; never rebuilds the item list, so it is safe to call
  // from a checkbox's own change handler.
  function updatePanelButtons(){
    var s=S; if(!s||!s.lists||!s.panelMode) return;
    var items=panelItems(), picked=pickedRefs().length;
    s.pnlAll.checked=!!items.length&&picked===items.length;
    s.pnlAll.indeterminate=picked>0&&picked<items.length;
    s.pnlAll.disabled=!items.length;
    s.pnlPicked.textContent=picked?'('+picked+' selected)':'';
    s.tmpAddMenu.btn.disabled=!picked;
    s.tmpRemove.disabled=!picked;
    s.lstRemove.disabled=!picked;
    s.lstMore.btn.disabled=!s.listId;
  }
  function renderPanel(){
    var s=S, st=s.lists.store, temp=s.panelMode==='temp';
    s.pnlTempHead.hidden=!temp; s.pnlListHead.hidden=temp;
    s.pnlTempActions.hidden=!temp; s.pnlListActions.hidden=temp;
    s.panel.setAttribute('aria-label',temp?'My temp list':'Saved lists');
    s.panel.setAttribute('data-mode',s.panelMode);
    if(!temp){
      var ls=M().list(st);
      if(!ls.some(function(c){ return c.id===s.listId; })) s.listId=ls.length?ls[0].id:null;
      s.lstPick.innerHTML='';
      if(!ls.length) s.lstPick.appendChild(h('option',{value:'',text:'No saved lists yet'}));
      ls.forEach(function(c){ s.lstPick.appendChild(h('option',{value:c.id,text:c.label+' ('+c.count+')'})); });
      s.lstPick.value=s.listId||''; s.lstPick.disabled=!ls.length;
    }
    var items=panelItems();
    Object.keys(s.picked).forEach(function(r){ if(items.indexOf(r)<0) delete s.picked[r]; });
    s.pnlItems.innerHTML='';
    if(!items.length){
      s.pnlItems.appendChild(h('li',{'class':'sg-temp-empty',text:temp?'Empty. Select rows in the table and use Add to temp list.'
        :(s.listId?'This list is empty.':'No saved lists yet. Save one from My temp list.')}));
    }
    items.forEach(function(r){
      var box=h('input',{type:'checkbox','data-sg-item':r,'aria-label':'Select '+labelOf(r)});
      box.checked=!!s.picked[r];
      box.addEventListener('change',function(){ if(box.checked) s.picked[r]=1; else delete s.picked[r]; updatePanelButtons(); });
      var ls=M().membership(st,r);
      s.pnlItems.appendChild(h('li',{'class':'sg-temp-item'+(M().inTemp(st,r)?' sg-in-temp':'')},[
        h('label',{'class':'sg-temp-item-lbl'},[box,h('span',{'class':'sg-temp-item-text'},[
          h('span',{'class':'sg-temp-item-name',text:labelOf(r)}),
          h('span',{'class':'sg-temp-item-lists',text:ls.length?ls.join(', '):'No list'})])])
      ]));
    });
    var here=s.dv.getItems().filter(function(it){ return items.indexOf(s.lists.refOf(it[s.rowKey]))>=0; }).length;
    s.pnlSummary.textContent=items.length+(items.length===1?' item':' items')+(items.length?', '+here+' on this screen':'');
    updatePanelButtons();

  // A control that sets state also shows it: badge, expanded states, the

                         placeholder:'New list name','data-sg':'temp-name',maxlength:'60'});
    var nCancel=h('button',{type:'button','class':'sg-btn',text:'Cancel',on:{click:function(){ hidePanelForms(); s.tmpAddMenu.btn.focus(); }}});

  // ---------- pinned columns on narrow screens (Matt, 2026-09-30, option A) ----------
  // Below PIN_BELOW px of grid width, the checkbox and the columns named in
  // opts.pin (e.g. ['id','name']) stay put while the rest scrolls sideways.
  // The last pinned column narrows so the pinned part takes at most about
  // 62% of the width. SlickGrid's pinned pane cannot scroll up and down on
  // its own (it relies on a wheel handler we keep off for smooth scrolling),
  // so it scrolls natively with its scrollbar hidden and follows the main pane.
  var PIN_BELOW=1024, PIN_SHARE=0.62, PIN_MIN=100;
  function applyPin(){
    var s=S; if(!s||!s.pinKeys.length) return;
    var w=s.gridEl.clientWidth, want=w>0&&w<PIN_BELOW, g=s.grid;
    var cols=g.getColumns();
    if(!want){
      if(!s.pinned) return;
      s.pinned=false;
      var order=s.baseOrder, byId={}; cols.forEach(function(c){ byId[c.id]=c; });
      var back=order.map(function(id){ return byId[id]; }).filter(Boolean);
      back.forEach(function(c){ if(s.pinWidths[c.id]) c.width=s.pinWidths[c.id]; });
      g.setOptions({frozenColumn:-1}); g.setColumns(back); g.invalidate();
      return;
    }
    var ids=['_checkbox_selector'].concat(s.pinKeys), pins=[], rest=[];
    ids.forEach(function(id){ var c=cols.filter(function(x){ return x.id===id; })[0]; if(c) pins.push(c); });
    cols.forEach(function(c){ if(pins.indexOf(c)<0) rest.push(c); });
    var last=pins[pins.length-1];
    if(!s.pinned){ s.pinWidths={}; s.pinWidths[last.id]=last.width; }
    var fixed=pins.slice(0,-1).reduce(function(a,c){ return a+c.width; },0);
    last.width=Math.max(PIN_MIN,Math.min(s.pinWidths[last.id],Math.floor(w*PIN_SHARE)-fixed));
    var was=s.pinned; s.pinned=true;
    g.setColumns(pins.concat(rest));
    if(!was) g.setOptions({frozenColumn:pins.length-1});
    g.invalidate();
    syncPinnedScroll();
  }
  function syncPinnedScroll(){
    var s=S, left=s.gridEl.querySelector('.slick-pane-top.slick-pane-left .slick-viewport'),
        right=s.gridEl.querySelector('.slick-pane-top.slick-pane-right .slick-viewport');
    if(!left||!right||left.__sgSync) return;
    left.__sgSync=true;
    left.addEventListener('scroll',function(){ if(Math.abs(right.scrollTop-left.scrollTop)>0.5) right.scrollTop=left.scrollTop; },{passive:true});
  }

  function openDialog(title,build,o){
    var s=S; if(s.dialog) s.dialog.close();
    var body=h('div',{'class':'sg-dialog-body','data-sg':'dialog-body'});
    var x=h('button',{type:'button','class':'sg-iconbtn','aria-label':'Close',title:'Close','data-sg':'dialog-close',text:'✕'});
    var dlg=h('div',{'class':'sg-dialog'+(o&&o.wide?' sg-dialog--wide':''),role:'dialog','aria-modal':'true','aria-labelledby':'sg-dialog-title','data-sg':'dialog'},[
      h('div',{'class':'sg-dialog-head'},[h('h3',{'class':'sg-dialog-title',id:'sg-dialog-title',text:title}),x]),body]);
    var scrim=h('div',{'class':'sg-scrim','data-sg':'dialog-scrim'},[dlg]);
    var ret=document.activeElement, cleanup=null;
    var d={el:dlg};
    d.close=function(){
      if(s.dialog!==d) return;
      s.dialog=null;
      if(typeof cleanup==='function') cleanup();
      scrim.remove();
      if(ret&&ret.focus&&document.contains(ret)) ret.focus();
    };
    s.dialog=d;
    s.screen.appendChild(scrim);
    x.addEventListener('click',d.close);
    scrim.addEventListener('mousedown',function(e){ if(e.target===scrim) d.close(); });
    dlg.addEventListener('keydown',function(e){
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); d.close(); return; }
      if(e.key!=='Tab') return;
      var f=focusables(dlg); if(!f.length) return;
      if(e.shiftKey&&document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
      else if(!e.shiftKey&&document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); }
    });
    cleanup=build(body,d.close);
    var first=focusables(body)[0]||x; first.focus();
    return d;
  }

  // ---------- export ----------
  function exportRows(){
    var s=S, o=s.opts;
    var loader=typeof o.ensureXLSX==='function'?o.ensureXLSX:function(){ return Promise.resolve(); };
    if(s.expBtn) s.expBtn.disabled=true;
    return Promise.resolve().then(loader).then(function(lib){
      var X=lib||root.XLSX;
      if(!X||!X.utils) throw new Error('The Excel library is not available.');
      var aoa=[s.cols.map(function(c){ return c.label; })];
      for(var i=0;i<s.dv.getLength();i++){
        var it=s.dv.getItem(i);
        aoa.push(s.cols.map(function(c){
          var v=it[c.key];
          if(v==null||v==='') return '';
          if(c.type==='number') return Number(v);
          if(c.type==='date' && isoOk(v)) return new Date(Date.UTC(+v.slice(0,4),+v.slice(5,7)-1,+v.slice(8,10)));
          if(c.type==='select') return optLabel(c,v);

      ws['!cols']=s.cols.map(function(c){ return {wch:Math.max(8,Math.round((c.width||100)/7))}; });

      X.writeFile(wb,name+'.xlsx');

  function commitImport(res,fileName,ui){

        if(grid.getEditorLock().isActive()){ pending=true; return; }
        pending=false; grid.resizeCanvas(); applyPin();
      };
      // A timer, not requestAnimationFrame: it still runs outside the observer
      // callback, and it fires even when no frame is being drawn.
      var schedule=function(){ if(timer) root.clearTimeout(timer); timer=root.setTimeout(doResize,0); };
      grid.onBeforeCellEditorDestroy.subscribe(function(){ if(pending) schedule(); });
      S.requestResize=schedule;
      S.ro=new root.ResizeObserver(function(entries){
        var r=entries[0]&&entries[0].contentRect; if(!r||(r.width===lastW&&r.height===lastH)) return;
        lastW=r.width; lastH=r.height;
        schedule();
      });
      S.ro.observe(gridEl);
    }
    updateStatus();
    S.gridEl=gridEl; S.pinKeys=(opts.pin||[]).filter(function(k){ return !!colByKey[k]&&!colByKey[k].hidden; });
    S.baseOrder=grid.getColumns().map(function(c){ return c.id; }); S.pinned=false;
    applyPin();
    if(dv.getLength()) grid.setActiveCell(0,firstDataCell());
    if(carried&&viewMenu) viewMenu.btn.focus();
    return api;
  }

  function close(silent){
    var s=S; if(!s) return;
    if(s.openMenu) s.openMenu.close(false);
    if(s.dialog) s.dialog.close();
    if(s.hpick){ s.hpick.remove(); document.removeEventListener('mousedown',s.hpickOff,true); }
    S=null;
    if(s.ro) s.ro.disconnect();
    if(s.grid.getEditorLock().isActive()) s.grid.getEditorLock().cancelCurrentEdit();
    s.grid.destroy();
    s.screen.remove();
    if(!silent && s.returnFocus && s.returnFocus.focus && document.contains(s.returnFocus)) s.returnFocus.focus();
  }

  // Replace the rows in the open grid (e.g. after the caller changes its data).
  function setRows(rows){
    var s=S; if(!s) return;
    s.grid.setSelectedRows([]);
    s.dv.setItems((rows||[]).map(function(r){ return Object.assign({},r); }),s.rowKey);
    if(s.lists) refreshLists(); else { s.grid.invalidate(); updateStatus(); }
  }

  var api={
    open:open,
    close:function(){ close(); },
    isOpen:function(){ return !!S; },
    setRows:setRows,
    patchRows:patchRows,
    exportVisible:function(){ return S?exportRows():Promise.resolve(null); },
    // A centred modal dialog on the open screen; build(body, close) may return a cleanup.
    dialog:function(title,build,o){ return S?openDialog(title,build,o):null; },
    // Reopen the screen with a new config (e.g. after the caller's data
    // changed) keeping where Back returns to.
    refresh:function(o){ if(S) S.switching=true; return open(o); },
    // For the app's own import form: hand in the parsed sheet, and the grid
    // runs the same checks, question, log and summary in its dialog.
    importAoa:function(aoa,fileName){
      if(!S||!S.opts.importer) return null;
      openDialog(importTitle(),function(body,close){
        var ui={pick:h('div'),status:h('div',{'class':'sg-import-status','data-sg':'import-status'}),go:h('button'),close:close,onCancel:close};
        body.appendChild(h('div',{'class':'sg-import-row'},[dateSelect(ui)])); body.appendChild(ui.status);
        runImport(aoa,fileName||'Imported sheet',ui);
      });
      return true;
    },
    // Test hook only: the engine objects of the open screen.
    // requestResize is the exact path a ResizeObserver report takes.
    _engine:function(){ return S?{grid:S.grid,dataView:S.dv,requestResize:S.requestResize}:null; },
    _fmtDate:fmtDate
